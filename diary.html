<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Voce Viva - Diario</title>
<meta name="theme-color" content="#0a0a0f">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=EB+Garamond:ital,wght@1,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="vv-auth.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg:#0a0a0f; --surface:#111118; --border:#1e1e2e; --accent:#f55036; --text:#e8e8f0; --muted:#5a5a7a; --live:#4ade80; --warn:#f59e0b; }
body { min-height:100vh; background:var(--bg); color:var(--text); font-family:'JetBrains Mono',monospace; display:flex; flex-direction:column; align-items:center; padding:1.5rem 1rem 3rem; -webkit-tap-highlight-color:transparent; }
body::before { content:''; position:fixed; inset:0; z-index:0; pointer-events:none; background:radial-gradient(ellipse 80% 50% at 5% 95%,rgba(245,80,54,.08) 0%,transparent 60%),radial-gradient(ellipse 50% 40% at 95% 5%,rgba(245,80,54,.05) 0%,transparent 60%); }
.container { position:relative; z-index:1; width:100%; max-width:640px; display:flex; flex-direction:column; gap:1.1rem; }
.mode-switcher { display:inline-flex; gap:.3rem; background:var(--surface); border:1px solid var(--border); border-radius:.6rem; padding:.25rem; }
.mode-btn { background:none; border:none; color:var(--muted); padding:.35rem .55rem; border-radius:.4rem; cursor:pointer; touch-action:manipulation; transition:background .2s,color .2s; text-decoration:none; display:flex; align-items:center; justify-content:center; }
.mode-btn svg { width:16px; height:16px; }
.mode-btn.active { background:var(--accent); color:#fff; }
/* Profile menu */
.profile-wrap { position:relative; display:flex; align-items:center; }
.profile-btn { width:2.2rem; height:2.2rem; border-radius:50%; background:var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text); transition:background .2s; padding:0; flex-shrink:0; }
.profile-btn svg { width:1.3rem; height:1.3rem; }
.profile-btn:hover { background:rgba(245,80,54,.1); border-color:var(--accent); }
.profile-dropdown { position:absolute; right:0; top:calc(100% + .5rem); background:var(--surface); border:1px solid var(--border); border-radius:.8rem; padding:.75rem 1rem; min-width:190px; display:none; flex-direction:column; gap:.45rem; z-index:200; box-shadow:0 8px 24px rgba(0,0,0,.35); }
.profile-dropdown.open { display:flex; }
.profile-email { font-size:.68rem; color:var(--muted); word-break:break-all; line-height:1.4; }
.profile-divider { border:none; border-top:1px solid var(--border); margin:.15rem 0; }
.profile-signout { background:none; border:none; color:#f55036; font-family:'JetBrains Mono',monospace; font-size:.72rem; cursor:pointer; text-align:left; padding:.15rem 0; }
.profile-signout:hover { text-decoration:underline; }
.header-row { display:flex; justify-content:space-between; align-items:flex-start; }
h1 { font-family:'DM Serif Display',serif; font-size:clamp(1.6rem,5vw,2.2rem); letter-spacing:-.03em; line-height:1; }
h1 em { font-style:italic; color:var(--accent); }
.subtitle { font-size:.6rem; color:var(--muted); text-transform:uppercase; letter-spacing:.18em; margin-top:.4rem; }
.view-switcher { display:inline-flex; gap:.4rem; background:var(--surface); border:1px solid var(--border); border-radius:.8rem; padding:.35rem; }
.view-btn { flex:1; background:none; border:none; color:var(--muted); padding:.5rem; border-radius:.5rem; cursor:pointer; touch-action:manipulation; transition:background .2s,color .2s; display:flex; align-items:center; justify-content:center; }
.view-btn svg { width:18px; height:18px; }
.view-btn.active { background:var(--accent); color:#fff; }
/* Calendar */
.cal-nav { display:flex; justify-content:space-between; align-items:center; padding:.5rem 0; }
.cal-nav-btn { background:none; border:1px solid var(--border); color:var(--muted); width:32px; height:32px; border-radius:.5rem; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:.8rem; transition:border-color .2s,color .2s; }
.cal-nav-btn:hover { border-color:var(--accent); color:var(--accent); }
.cal-month { font-family:'DM Serif Display',serif; font-size:1.1rem; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
.cal-header { font-size:.55rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); text-align:center; padding:.4rem 0; }
.cal-day { position:relative; aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:.5rem; font-size:.72rem; cursor:default; transition:background .15s; }
.cal-day.other { color:var(--border); }
.cal-day.today { background:rgba(245,80,54,.1); color:var(--accent); font-weight:500; }
.cal-day.has-notes { cursor:pointer; }
.cal-day.has-notes:hover { background:rgba(245,80,54,.15); }
.cal-day.selected { background:rgba(245,80,54,.25); }
.cal-dot { width:5px; height:5px; border-radius:50%; background:var(--accent); position:absolute; bottom:4px; }
.cal-day .add-btn { display:none; position:absolute; top:2px; right:2px; width:14px; height:14px; background:var(--accent); border:none; border-radius:50%; color:#fff; font-size:.65rem; line-height:1; cursor:pointer; align-items:center; justify-content:center; padding:0; }
.cal-day:hover .add-btn, .cal-day.today .add-btn { display:flex; }
.cal-day.other .add-btn { display:none !important; }
/* Day panel */
.day-panel { display:flex; flex-direction:column; gap:.6rem; margin-top:.4rem; }
.day-panel-header { font-size:.62rem; color:var(--muted); text-transform:uppercase; letter-spacing:.12em; padding:.3rem 0; border-bottom:1px solid var(--border); }
.read-card { background:var(--surface); border:1px solid var(--border); border-radius:.8rem; padding:1rem; }
.read-card-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:.75rem; gap:.5rem; }
.read-card-title { font-family:'DM Serif Display',serif; font-size:1rem; color:var(--text); flex:1; }
.read-card-close { background:none; border:none; color:var(--muted); font-size:1rem; cursor:pointer; padding:.1rem .3rem; line-height:1; flex-shrink:0; }
.read-card-close:hover { color:var(--accent); }
.read-card-body { font-size:1rem; line-height:1.85; color:var(--text); font-family:'Crimson Pro',Georgia,serif; overflow-wrap:break-word; word-break:break-word; }
.read-card-body p { margin-bottom:.55rem; }
.read-card-body h1 { font-family:'Crimson Pro',Georgia,serif; font-size:1.2em; font-weight:500; color:#fff; border-bottom:1px solid var(--border); padding-bottom:.25em; margin:.3em 0 .45em; }
.read-card-body h2 { font-family:'Crimson Pro',Georgia,serif; font-size:1.1em; font-weight:500; color:#ddd; margin:.5em 0 .3em; }
.read-card-body h3 { font-family:'DM Serif Display',serif; font-size:1.05em; margin:.5em 0 .25em; color:#c8c8d4; }
.read-card-body strong, .read-card-body b { color:#c8c8d4; font-weight:600; }
.read-card-body em, .read-card-body i { color:#fff; font-style:italic; font-family:'EB Garamond',Georgia,serif; }
.read-card-body ul, .read-card-body ol { margin:.3em 0 .3em 1.3em; padding:0; }
.read-card-body li { margin:.12em 0; }
.read-card-body img { max-width:100%; height:auto; border-radius:.4rem; }
.read-card-footer { margin-top:.85rem; display:flex; justify-content:flex-end; gap:.4rem; }
.btn-edit { background:rgba(245,158,11,.12); border:1px solid rgba(245,158,11,.4); color:var(--warn); padding:.38rem .8rem; border-radius:.5rem; font-family:'JetBrains Mono',monospace; font-size:.62rem; cursor:pointer; text-transform:uppercase; letter-spacing:.1em; transition:background .2s,border-color .2s,color .2s; }
.btn-edit:hover { background:rgba(245,158,11,.2); }
.btn-edit:active { background:none; border-color:var(--border); color:var(--muted); }
.btn-delete-card { background:none; border:1px solid rgba(240,106,106,.3); color:#f06a6a; padding:.38rem .8rem; border-radius:.5rem; font-family:'JetBrains Mono',monospace; font-size:.62rem; cursor:pointer; text-transform:uppercase; letter-spacing:.1em; transition:border-color .2s,background .2s; }
.btn-delete-card:hover { background:rgba(240,106,106,.1); }
.btn-pin { background:none; border:1px solid rgba(245,158,11,.3); color:var(--warn); padding:.38rem .8rem; border-radius:.5rem; font-family:'JetBrains Mono',monospace; font-size:.62rem; cursor:pointer; text-transform:uppercase; letter-spacing:.1em; transition:border-color .2s,background .2s,color .2s; display:flex; align-items:center; gap:.3rem; }
.btn-pin:hover { background:rgba(245,158,11,.12); border-color:rgba(245,158,11,.6); }
.btn-pin.pinned { background:rgba(245,158,11,.12); border-color:var(--warn); }
.note-card-btn.pin-btn { border-color:rgba(245,158,11,.3); color:var(--warn); }
.note-card-btn.pin-btn:hover { background:rgba(245,158,11,.1); border-color:rgba(245,158,11,.6); }
/* ── UNIFIED NOTE CARD ───────────────────────────────────────────────────── */
.note-vcard { background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--border); border-radius:.8rem; padding:.9rem 1.1rem; display:flex; flex-direction:column; gap:.4rem; cursor:pointer; transition:border-color .2s; }
/* Diario Guidato → verde acqua */
.note-vcard--guided { border-left-color:#2dd4bf; }
.note-vcard--guided:hover { border-color:rgba(45,212,191,.35); }
.note-vcard--guided .note-vcard-label { color:#2dd4bf; }
.note-vcard--guided .note-vcard-action-btn.edit:hover { border-color:#2dd4bf; color:#2dd4bf; }
/* Nota Libera → azzurro chiaro */
.note-vcard--free { border-left-color:#38bdf8; }
.note-vcard--free:hover { border-color:rgba(56,189,248,.35); }
.note-vcard--free .note-vcard-label { color:#38bdf8; }
.note-vcard--free .note-vcard-action-btn.edit:hover { border-color:#38bdf8; color:#38bdf8; }
/* Report settimanale → viola */
.note-vcard--report { border-left-color:#a78bfa; }
.note-vcard--report:hover { border-color:rgba(167,139,250,.35); }
.note-vcard--report .note-vcard-label { color:#a78bfa; }
.note-vcard--report .note-vcard-action-btn.edit:hover { border-color:#a78bfa; color:#a78bfa; }
.note-vcard-header { display:flex; align-items:center; justify-content:space-between; }
.note-vcard-meta { display:flex; align-items:center; gap:.4rem; flex-wrap:wrap; }
.note-vcard-label { font-size:.6rem; text-transform:uppercase; letter-spacing:.13em; display:flex; align-items:center; gap:.3rem; }
.note-vcard-label svg { width:11px; height:11px; flex-shrink:0; }
.note-vcard-badge { font-size:.5rem; text-transform:uppercase; letter-spacing:.08em; padding:.1rem .35rem; border-radius:.25rem; }
.note-vcard-badge.write { background:rgba(74,222,128,.08); color:var(--live); border:1px solid rgba(74,222,128,.2); }
.note-vcard-badge.ai { background:rgba(147,112,219,.1); color:#a78bfa; border:1px solid rgba(147,112,219,.2); }
.note-vcard-badge.rec { background:rgba(245,80,54,.1); color:var(--accent); border:1px solid rgba(245,80,54,.25); }
.note-vcard-date { font-size:.65rem; color:var(--muted); font-family:'JetBrains Mono',monospace; }
.note-vcard-actions { display:flex; align-items:center; gap:.3rem; flex-shrink:0; }
.note-vcard-action-btn { background:none; border:1px solid var(--border); border-radius:.35rem; color:var(--muted); width:26px; height:26px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .15s; padding:0; flex-shrink:0; }
.note-vcard-action-btn.edit:hover { border-color:inherit; color:inherit; }
.note-vcard-action-btn.pin-btn:hover { border-color:rgba(245,158,11,.6); color:var(--warn); }
.note-vcard-action-btn.pin-btn.pin-active { color:var(--warn); border-color:rgba(245,158,11,.4); background:rgba(245,158,11,.08); }
.note-vcard-action-btn.pin-btn.pin-active:hover { color:var(--muted); border-color:var(--border); background:none; }
.note-vcard-action-btn.pin-btn.pin-active svg path { fill:currentColor; stroke:none; }
.note-vcard-action-btn.pin-btn.pin-active svg line { stroke:currentColor; }
.note-vcard-title { font-family:'Crimson Pro',Georgia,serif; font-size:1.15rem; color:var(--text); line-height:1.3; }
.note-vcard-excerpt { font-size:.82rem; color:var(--muted); line-height:1.65; }
.note-vcard-full { display:none; font-family:'Crimson Pro',Georgia,serif; font-size:1rem; color:var(--text); line-height:1.85; border-top:1px solid var(--border); padding-top:.65rem; margin-top:.1rem; overflow-wrap:break-word; word-break:break-word; }
.note-vcard.expanded .note-vcard-full { display:block; }
.note-vcard.expanded .note-vcard-excerpt { display:none; }
.note-vcard-full p { margin-bottom:.6rem; }
.note-vcard-full h2 { font-family:'Crimson Pro',Georgia,serif; font-size:1.15em; font-weight:500; color:#ddd; margin:.7rem 0 .3rem; }
.note-vcard-full h3 { font-family:'DM Serif Display',serif; font-size:1.05em; color:#c8c8d4; margin:.6rem 0 .25rem; }
.note-vcard-full ul,.note-vcard-full ol { padding-left:1.3rem; margin:.3rem 0 .4rem; }
.note-vcard-full li { margin:.12rem 0; }
.note-vcard-full strong { color:#c8c8d4; font-weight:600; }
.note-vcard-full em { font-style:italic; font-family:'EB Garamond',Georgia,serif; color:#fff; }
.note-vcard-footer { display:flex; justify-content:flex-end; padding-top:.5rem; border-top:1px solid var(--border); margin-top:.15rem; }
.note-vcard-delete-btn { background:none; border:1px solid rgba(240,106,106,.3); border-radius:.4rem; color:#f06a6a; font-family:'JetBrains Mono',monospace; font-size:.58rem; text-transform:uppercase; letter-spacing:.1em; padding:.28rem .6rem; cursor:pointer; display:flex; align-items:center; gap:.3rem; transition:all .15s; }
.note-vcard-delete-btn:hover { background:rgba(240,106,106,.1); border-color:#f06a6a; }
.note-vcard-delete-btn svg { flex-shrink:0; }
/* Cronologia */
.notes-section { display:flex; flex-direction:column; gap:.6rem; }
.month-header { display:flex; align-items:center; gap:.3rem; font-family:'DM Serif Display',serif; font-size:1.35rem; color:var(--text); padding:1rem 0 .4rem; margin-top:.8rem; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
.month-header:first-child { margin-top:0; }
.month-header-label { margin-right:0; }
.month-header-count { font-family:'JetBrains Mono',monospace; font-size:.9rem; color:var(--muted); letter-spacing:.05em; margin-left:auto; }
.month-header-chevron { display:flex; align-items:center; justify-content:center; width:1.6rem; height:1.6rem; border:1px solid var(--border); border-radius:.4rem; color:var(--muted); font-size:1.1rem; line-height:1; transition:transform .25s ease,border-color .2s; }
.month-header:hover .month-header-chevron { border-color:var(--accent); color:var(--accent); }
.month-header.collapsed .month-header-chevron { transform:rotate(-90deg); }
.month-group { display:flex; flex-direction:column; gap:.6rem; overflow:hidden; }
.week-header { font-size:.9rem; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); padding:1.5rem 0 .4rem; border-bottom:1px solid var(--border); }
.month-group .week-header:first-child { padding-top:.3rem; }
.note-card { background:var(--surface); border:1px solid var(--border); border-radius:.8rem; padding:.85rem; cursor:pointer; transition:border-color .2s; display:flex; justify-content:space-between; align-items:center; gap:.5rem; }
.note-card:hover { border-color:rgba(245,80,54,.4); }
.note-card-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:.2rem; }
.note-title { font-family:'DM Serif Display',serif; font-size:.88rem; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.note-meta { display:flex; gap:.4rem; align-items:center; }
.note-date { font-size:.58rem; color:var(--muted); white-space:nowrap; }
.note-tags { display:flex; gap:.25rem; }
.note-tag { font-size:.5rem; text-transform:uppercase; letter-spacing:.08em; padding:.1rem .35rem; border-radius:.25rem; background:rgba(245,80,54,.12); color:var(--accent); border:1px solid rgba(245,80,54,.25); }
.note-tag.tag-write { background:rgba(74,222,128,.08); color:var(--live); border-color:rgba(74,222,128,.2); }
.note-tag.tag-ai { background:rgba(147,112,219,.1); color:#a78bfa; border-color:rgba(147,112,219,.2); }
.note-card-actions { display:flex; gap:.3rem; flex-shrink:0; }
.note-card-btn { background:none; border:1px solid var(--border); color:var(--muted); padding:.3rem .6rem; border-radius:.4rem; font-family:'JetBrains Mono',monospace; font-size:.58rem; cursor:pointer; touch-action:manipulation; transition:border-color .2s,color .2s; white-space:nowrap; }
.note-card-btn:hover { border-color:var(--accent); color:var(--accent); }
.note-card-btn.del { border-color:rgba(240,106,106,.3); color:#f06a6a; }
.note-card-btn.del:hover { background:rgba(240,106,106,.08); }
.list-add-row { display:flex; justify-content:flex-end; padding:.2rem 0 .4rem; }
.btn-add-list { background:var(--accent); border:none; color:#fff; width:32px; height:32px; border-radius:50%; font-size:1.2rem; cursor:pointer; display:flex; align-items:center; justify-content:center; touch-action:manipulation; box-shadow:0 4px 16px rgba(245,80,54,.35); }
/* Loading/error */
.empty-state { text-align:center; padding:3rem 1rem; color:var(--muted); font-size:.72rem; line-height:2; }
.loading-state { text-align:center; padding:2rem; }
.spinner { display:inline-block; width:18px; height:18px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
.error-msg { background:rgba(240,106,106,.08); border:1px solid rgba(240,106,106,.25); border-radius:.6rem; padding:.65rem .85rem; font-size:.68rem; color:#f06a6a; line-height:1.6; display:none; }
.error-msg.show { display:block; }
/* Read overlay */
.read-overlay { display:none; position:fixed; inset:0; z-index:80; background:var(--bg); flex-direction:column; }
.read-overlay.show { display:flex; animation:slideUp .25s ease-out; }
.read-overlay-header { display:flex; justify-content:space-between; align-items:center; padding:1.1rem 1.2rem .8rem; border-bottom:1px solid var(--border); flex-shrink:0; }
.read-overlay-title { font-family:'DM Serif Display',serif; font-size:1.1rem; color:var(--text); flex:1; margin-right:.5rem; }
.read-overlay-close { background:none; border:none; color:var(--muted); font-size:1.2rem; cursor:pointer; padding:.1rem .3rem; line-height:1; }
.read-overlay-body { flex:1; overflow-y:auto; padding:1.2rem; font-size:1.08rem; line-height:1.9; color:var(--text); font-family:'Crimson Pro',Georgia,serif; overflow-wrap:break-word; word-break:break-word; }
.read-overlay-body p { margin-bottom:.65rem; }
.read-overlay-body h1 { font-family:'Crimson Pro',Georgia,serif; font-size:1.35em; font-weight:500; color:#fff; border-bottom:1px solid var(--border); padding-bottom:.25em; margin:.3em 0 .5em; }
.read-overlay-body h2 { font-family:'Crimson Pro',Georgia,serif; font-size:1.2em; font-weight:500; color:#ddd; margin:.7em 0 .35em; }
.read-overlay-body h3 { font-family:'DM Serif Display',serif; font-size:1.1rem; margin:.6em 0 .3em; color:#c8c8d4; }
.read-overlay-body strong, .read-overlay-body b { color:#c8c8d4; font-weight:600; }
.read-overlay-body em, .read-overlay-body i { color:#fff; font-style:italic; font-family:'EB Garamond',Georgia,serif; }
.read-overlay-body ul, .read-overlay-body ol { margin:.4em 0 .4em 1.4em; padding:0; }
.read-overlay-body li { margin:.15em 0; }
.read-overlay-body img { max-width:100%; height:auto; border-radius:.5rem; }
.read-overlay-footer { padding:1rem 1.2rem; border-top:1px solid var(--border); display:flex; gap:.5rem; justify-content:flex-end; flex-shrink:0; }
/* ── ENTRY SWITCHER ────────────────────────────────────────────────────────── */
.entry-popup-overlay { display:none; position:fixed; inset:0; z-index:90; background:rgba(0,0,0,.65); backdrop-filter:blur(4px); align-items:center; justify-content:center; }
.entry-popup-overlay.show { display:flex; }
.entry-popup-card { background:var(--surface); border:1px solid var(--border); border-radius:1.4rem; width:100%; max-width:640px; display:flex; flex-direction:column; gap:.6rem; padding:1.3rem 1.3rem 1.8rem; animation:slideUp .25s ease-out; margin-bottom:auto; margin-top:auto; }
.entry-popup-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:.3rem; }
.entry-popup-title { font-size:.6rem; text-transform:uppercase; letter-spacing:.14em; color:var(--muted); }
.entry-popup-close { background:none; border:none; color:var(--muted); font-size:1.1rem; cursor:pointer; padding:.1rem .3rem; line-height:1; }
.entry-popup-btn { display:flex; align-items:center; gap:.6rem; background:none; border:1px solid var(--border); border-radius:.8rem; color:var(--text); font-family:'JetBrains Mono',monospace; font-size:.72rem; padding:.8rem 1rem; cursor:pointer; touch-action:manipulation; transition:background .15s,border-color .2s,color .2s; }
.entry-popup-btn:hover { background:rgba(245,80,54,.06); border-color:rgba(245,80,54,.4); color:var(--accent); }
.entry-popup-btn svg { width:18px; height:18px; flex-shrink:0; }

</style>
<script src="vv-memory.js"></script>
</head>
<body>
<div class="container">

  <div class="header-row">
    <header>

<script>
// ── SUPABASE ──────────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://ezycobgovadcgvnyqcew.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ASHxxToKJyMy4CpBAqseqA_mepXAAJ-';
let sb = null;
try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e) {}

// ── STATE ─────────────────────────────────────────────────────────────────────
let allNotes = [], currentYear, currentMonth;
let selectedDay = null, currentView = 'calendar';
let readingNote = null;
let currentUserId = null;

const MONTHS_IT=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const DAYS_IT=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];

const $ = id => document.getElementById(id);
const errorMsg      = $('errorMsg');
const loadingState  = $('loadingState');
const calGrid       = $('calGrid');
const calMonthLabel = $('calMonthLabel');
const dayPanel      = $('dayPanel');
const notesList     = $('notesList');
const calendarView  = $('calendarView');
const listView      = $('listView');
const readOverlay   = $('readOverlay');
const readOverlayTitle = $('readOverlayTitle');
const readOverlayBody  = $('readOverlayBody');

// ── INIT ──────────────────────────────────────────────────────────────────────
const now = new Date();
currentYear = now.getFullYear(); currentMonth = now.getMonth();
renderCalendar();

$('viewCalBtn').onclick = () => switchView('calendar');
$('viewListBtn').onclick = () => switchView('list');
$('prevMonth').onclick = () => { currentMonth--; if(currentMonth<0){currentMonth=11;currentYear--;} selectedDay=null; renderCalendar(); };
$('nextMonth').onclick = () => { currentMonth++; if(currentMonth>11){currentMonth=0;currentYear++;} selectedDay=null; renderCalendar(); };

$('readOverlayClose').onclick = () => { readOverlay.classList.remove('show'); readingNote=null; };
$('readOverlayEdit').onclick  = () => { readOverlay.classList.remove('show'); if(readingNote) openEditInFreeNote(readingNote); };
$('readOverlayPin').onclick   = () => { if(readingNote) pinNote(readingNote, $('readOverlayPin')); };
$('readOverlayDelete').onclick = async () => {
  if(!readingNote || !confirm('Eliminare questa nota?')) return;
  try {
    const{error}=await sb.from('notes').delete().eq('id',readingNote.id);
    if(error) throw error;
    readOverlay.classList.remove('show'); readingNote=null; await loadNotes();
  } catch(e) { showErr('Errore eliminazione: '+(e.message||e)); }
};

async function loadNotes() {
  loadingState.style.display='block'; hideErr();
  if(!sb) { showErr('Supabase non inizializzato.'); loadingState.style.display='none'; return; }
  if(!currentUserId) { loadingState.style.display='none'; return; }
  try {
    const{data,error}=await sb.from('notes').select('*')
      .eq('user_id', currentUserId)
      .order('note_date',{ascending:false});
    if(error) throw error;
    allNotes=data||[]; loadingState.style.display='none';
    if(currentView==='calendar') renderCalendar(); else renderList();
  } catch(e) { loadingState.style.display='none'; showErr('Errore caricamento note: '+(e.message||e)); }
}

async function deleteNote(id) {
  if(!confirm('Eliminare questa nota?')) return;
  try {
    const{error}=await sb.from('notes').delete().eq('id',id);
    if(error) throw error;
    await loadNotes();
  } catch(e) { showErr('Errore eliminazione: '+(e.message||e)); }
}

function switchView(view) {
  currentView=view;
  if(view==='calendar') {
    $('viewCalBtn').classList.add('active'); $('viewListBtn').classList.remove('active');
    calendarView.style.display=''; listView.style.display='none'; renderCalendar();
  } else {
    $('viewListBtn').classList.add('active'); $('viewCalBtn').classList.remove('active');
    calendarView.style.display='none'; listView.style.display=''; renderList();
  }
}

// ── CALENDAR ──────────────────────────────────────────────────────────────────
function renderCalendar() {
  calMonthLabel.textContent=MONTHS_IT[currentMonth]+' '+currentYear;
  const noteDates=new Set();
  const ms=currentYear+'-'+String(currentMonth+1).padStart(2,'0');
  allNotes.forEach(n=>{if(n.note_date&&n.note_date.startsWith(ms))noteDates.add(n.note_date);});
  const firstDay=new Date(currentYear,currentMonth,1);
  let startDow=firstDay.getDay(); startDow=startDow===0?6:startDow-1;
  const dim=new Date(currentYear,currentMonth+1,0).getDate();
  const pmd=new Date(currentYear,currentMonth,0).getDate();
  const td=new Date();
  const ts=td.getFullYear()+'-'+String(td.getMonth()+1).padStart(2,'0')+'-'+String(td.getDate()).padStart(2,'0');
  let html='';
  DAYS_IT.forEach(d=>{html+='<div class="cal-header">'+d+'</div>';});
  for(let i=startDow-1;i>=0;i--) html+='<div class="cal-day other">'+(pmd-i)+'</div>';
  for(let d=1;d<=dim;d++) {
    const dateStr=currentYear+'-'+String(currentMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isToday=dateStr===ts, hasN=noteDates.has(dateStr), isSel=selectedDay===d;
    let cls='cal-day'; if(isToday) cls+=' today'; if(hasN) cls+=' has-notes'; if(isSel) cls+=' selected';
    html+='<div class="'+cls+'" data-day="'+d+'" data-date="'+dateStr+'">'+d
      +(hasN?'<span class="cal-dot"></span>':'')
      +'<button class="add-btn" data-date="'+dateStr+'">+</button></div>';
  }
  const rem=(startDow+dim)%7===0?0:7-(startDow+dim)%7;
  for(let i=1;i<=rem;i++) html+='<div class="cal-day other">'+i+'</div>';
  calGrid.innerHTML=html;
  calGrid.querySelectorAll('.add-btn').forEach(b=>{
    b.onclick=(e)=>{e.stopPropagation();openEntrySwitcher(b.dataset.date);};
  });
  calGrid.querySelectorAll('.cal-day.has-notes').forEach(el=>{
    el.onclick=()=>{
      const day=parseInt(el.dataset.day), dateStr=el.dataset.date;
      selectedDay=day;
      calGrid.querySelectorAll('.cal-day').forEach(c=>c.classList.remove('selected'));
      el.classList.add('selected'); showDayPanel(dateStr);
    };
  });
  if(selectedDay) {
    const ds=currentYear+'-'+String(currentMonth+1).padStart(2,'0')+'-'+String(selectedDay).padStart(2,'0');
    showDayPanel(ds);
  } else { dayPanel.innerHTML=''; }
}

function tagsHtml(mode) {
  if(!mode) return '';
  const tags=(mode||'').split('+').map(t=>t.trim()).filter(Boolean);
  return tags.map(t=>{
    const cls=t==='write'?'note-tag tag-write':t==='AI'?'note-tag tag-ai':t&&t.includes('photo')?'note-tag tag-photo':'note-tag';
    return '<span class="'+cls+'">'+esc(t)+'</span>';
  }).join('');
}

// ── HELPERS: NOTE CARD ────────────────────────────────────────────────────────
function _getPinnedNoteId() {
  try { var r=localStorage.getItem('vv_pinned_note'); return r?JSON.parse(r).noteId||null:null; } catch(e){return null;}
}

// Converte il vecchio formato emoji umore nel nuovo formato a pallini
function _normalizeMoodHtml(html) {
  if(!html||html.indexOf('Umore:')===-1) return html;
  var MOOD_COLORS = ['','#818cf8','#60a5fa','#94a3b8','#fbbf24','#4ade80'];
  var MOOD_TEXT   = ['','Molto basso','Basso','Neutro','Buono','Ottimo'];
  return html.replace(/<p[^>]*>\s*<strong[^>]*>Umore:[^(]*\(([1-5])\/5\)<\/strong>\s*<\/p>/gi, function(_, v) {
    var val = parseInt(v);
    var col = MOOD_COLORS[val] || '#888';
    var dots = '';
    for (var i = 1; i <= 5; i++) {
      dots += i <= val
        ? '<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:' + col + ';flex-shrink:0;"></span>'
        : '<span style="display:inline-block;width:9px;height:9px;border-radius:50%;border:1.5px solid #444;flex-shrink:0;"></span>';
    }
    return '<p style="display:flex;align-items:center;gap:.55rem;margin:.4rem 0 .6rem;">'
      + '<strong style="font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:#888;font-family:\'JetBrains Mono\',monospace;white-space:nowrap;">Umore</strong>'
      + '<span style="display:flex;gap:5px;align-items:center;">' + dots + '</span>'
      + '<span style="font-size:.6rem;color:' + col + ';font-family:\'JetBrains Mono\',monospace;">' + (MOOD_TEXT[val]||'') + '</span>'
      + '</p>';
  });
}

function buildNoteVCard(n) {
  // Fallback per note pre-esistenti senza campo source
  var _isReport=n.mode==='report';
  var _src=_isReport?'report':(n.source||(
    (n.mode&&['AI','rec','rec+write'].includes(n.mode))?'free':
    ((n.content||'').includes('<h3>')?'guided':'free')
  ));
  var _typeLabel=_src==='report'?'Report':(_src==='guided'?'Diario Guidato':'Nota Libera');
  var _reportIcon='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="12" y1="9" x2="8" y2="9"/></svg>';
  var _typeIcon=_src==='report'?_reportIcon:(_src==='guided'
    ?'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>'
    :'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>');
  var _modeBadges='';
  if(n.mode&&!['report','life-wheel'].includes(n.mode)){
    (n.mode||'').split('+').map(function(t){return t.trim();}).filter(Boolean).forEach(function(t){
      var tc=t.toLowerCase(),cls=tc==='write'?'write':tc==='ai'?'ai':tc==='rec'?'rec':'';
      if(cls) _modeBadges+='<span class="note-vcard-badge '+cls+'">'+esc(t)+'</span>';
    });
  }
  var _d=new Date((n.note_date||new Date().toISOString().split('T')[0])+'T12:00:00');
  var _mo=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
  var _ds=_d.getDate()+' '+_mo[_d.getMonth()]+' '+_d.getFullYear();
  var _pl=(n.content||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
  var _ex=_pl.length>140?_pl.slice(0,140)+'\u2026':_pl;
  var _pid=_getPinnedNoteId(),_ip=_pid===n.id,_pac=_ip?' pin-active':'';
  var card=document.createElement('div');
  card.className='note-vcard note-vcard--'+_src; card.dataset.id=n.id;
  card.innerHTML=
    '<div class="note-vcard-header">'
    +'<div class="note-vcard-meta">'
    +'<span class="note-vcard-label">'+_typeIcon+_typeLabel+'</span>'
    +_modeBadges
    +'<span class="note-vcard-date">'+_ds+'</span>'
    +'</div>'
    +'<div class="note-vcard-actions">'
    +'<button class="note-vcard-action-btn edit" title="Modifica nota"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="2" x2="22" y2="6"/><path d="M7.5 20.5 19 9l-4-4L3.5 16.5 2 22z"/></svg></button>'
    +'<button class="note-vcard-action-btn pin-btn'+_pac+'" title="'+(_ip?'Rimuovi pin':'Fissa nota')+'"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17z"/><line x1="12" y1="17" x2="12" y2="22"/></svg></button>'
    +'</div>'
    +'</div>'
    +'<div class="note-vcard-title">'+esc(n.title||'')+'</div>'
    +'<div class="note-vcard-excerpt">'+esc(_ex)+'</div>'
    +'<div class="note-vcard-full">'+_normalizeMoodHtml(n.content||'')+'</div>'
    +'<div class="note-vcard-footer">'
    +'<button class="note-vcard-delete-btn"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>Elimina</button>'
    +'</div>';
  card.addEventListener('click',function(e){
    if(e.target.closest('.note-vcard-actions')||e.target.closest('.note-vcard-footer')) return;
    card.classList.toggle('expanded');
  });
  card.querySelector('.note-vcard-action-btn.edit').addEventListener('click',function(e){
    e.stopPropagation(); openEditInFreeNote(n);
  });
  card.querySelector('.pin-btn').addEventListener('click',function(e){
    e.stopPropagation();
    var b=this,nowPinned=b.classList.contains('pin-active');
    if(nowPinned){
      localStorage.removeItem('vv_pinned_note');
      if(sb&&currentUserId){sb.from('vv_user_profile').upsert({user_id:currentUserId,pinned_note:null,updated_at:new Date().toISOString()},{onConflict:'user_id'}).then(function(){}).catch(function(){});}
      b.classList.remove('pin-active'); b.title='Fissa nota';
    } else { pinNote(n,b); }
  });
  card.querySelector('.note-vcard-delete-btn').addEventListener('click',function(e){
    e.stopPropagation(); deleteNote(n.id);
  });
  return card;
}

function showDayPanel(dateStr) {
  var notes=allNotes.filter(function(n){return n.note_date===dateStr;});
  if(!notes.length){dayPanel.innerHTML='';return;}
  var do2=new Date(dateStr+'T12:00:00');
  dayPanel.innerHTML='<div class="day-panel-header" style="display:flex;align-items:center;justify-content:space-between;">'
    +do2.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})
    +'<button style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:.1rem .3rem;line-height:1;" id="_dayPanelClose">&#x2715;</button>'
    +'</div>';
  notes.forEach(function(n){dayPanel.appendChild(buildNoteVCard(n));});
  document.getElementById('_dayPanelClose').onclick=function(){
    dayPanel.innerHTML=''; selectedDay=null;
    calGrid.querySelectorAll('.cal-day').forEach(function(c){c.classList.remove('selected');});
  };
}

// ── CRONOLOGIA ────────────────────────────────────────────────────────────────
function renderList() {
  notesList.innerHTML='';
  if(!allNotes.length){notesList.innerHTML='<div class="empty-state">Nessuna nota nel diario.<br>Registra o scrivi qualcosa e salvalo!</div>';return;}
  var months={};
  allNotes.forEach(function(n){
    var d=new Date(n.note_date+'T12:00:00');
    var mk=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    if(!months[mk]) months[mk]=[]; months[mk].push(n);
  });
  var sortedMonths=Object.keys(months).sort(function(a,b){return b.localeCompare(a);});
  sortedMonths.forEach(function(mk){
    var parts=mk.split('-').map(Number),y=parts[0],m=parts[1],count=months[mk].length;
    var mh=document.createElement('div'); mh.className='month-header'; mh.dataset.month=mk;
    mh.innerHTML='<span class="month-header-label">'+MONTHS_IT[m-1]+' '+y+'</span>'
      +'<span class="month-header-chevron">&#x25BE;</span>'
      +'<span class="month-header-count">'+count+' not'+(count===1?'a':'e')+'</span>';
    notesList.appendChild(mh);
    var mg=document.createElement('div'); mg.className='month-group'; mg.dataset.month=mk;
    var weeks={};
    months[mk].forEach(function(n){
      var d=new Date(n.note_date+'T12:00:00'),ws=getWeekStart(d),key=ws.toISOString().split('T')[0];
      if(!weeks[key]) weeks[key]=[]; weeks[key].push(n);
    });
    var sw=Object.keys(weeks).sort(function(a,b){return b.localeCompare(a);});
    sw.forEach(function(wk){
      var ws=new Date(wk+'T12:00:00'),we=new Date(ws); we.setDate(we.getDate()+6);
      var wh=document.createElement('div'); wh.className='week-header';
      wh.textContent=ws.toLocaleDateString('it-IT',{day:'numeric',month:'short'})+' \u2013 '+we.toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'});
      mg.appendChild(wh);
      weeks[wk].forEach(function(n){mg.appendChild(buildNoteVCard(n));});
    });
    notesList.appendChild(mg);
    mh.onclick=function(){
      var isOpen=!mh.classList.contains('collapsed');
      if(isOpen){
        mh.classList.add('collapsed');
        var h=mg.scrollHeight; mg.style.height=h+'px'; mg.offsetHeight;
        mg.style.transition='height .35s ease, opacity .25s ease'; mg.style.height='0px'; mg.style.opacity='0';
      } else {
        mh.classList.remove('collapsed');
        var targetH=mg.scrollHeight;
        mg.style.transition='height .35s ease, opacity .25s ease'; mg.style.height=targetH+'px'; mg.style.opacity='1';
        setTimeout(function(){if(!mh.classList.contains('collapsed')){mg.style.height='';mg.style.transition='';mg.style.opacity='';}},370);
      }
    };
  });
}

function getWeekStart(d){const day=d.getDay(),diff=d.getDate()-day+(day===0?-6:1);return new Date(d.getFullYear(),d.getMonth(),diff);}
function openReadOverlay(note){readingNote=note;readOverlayTitle.textContent=note.title;readOverlayBody.innerHTML=note.content;readOverlay.classList.add('show');}

function pinNote(note, btn) {
  if(!note) return;
  var _plain=(note.content||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
  var _pinData={title:note.title||'Nota senza titolo',content:note.content||'',plainText:_plain,date:note.note_date||new Date().toISOString().split('T')[0],noteId:note.id,pinnedAt:new Date().toISOString()};
  try{localStorage.setItem('vv_pinned_note',JSON.stringify(_pinData));}catch(e){return;}
  if(typeof sb!=='undefined'&&sb&&currentUserId){sb.from('vv_user_profile').upsert({user_id:currentUserId,pinned_note:_pinData,updated_at:new Date().toISOString()},{onConflict:'user_id'}).then(function(){}).catch(function(){});}
  document.querySelectorAll('.note-vcard-action-btn.pin-btn').forEach(function(b){
    var cardEl=b.closest('[data-id]');
    if(cardEl&&cardEl.dataset.id===note.id){
      b.classList.add('pin-active'); b.title='Rimuovi pin';
    } else {
      b.classList.remove('pin-active'); b.title='Fissa nota';
    }
  });
}

// ── REALTIME SYNC ────────────────────────────────────────────────────────────
// Aggiorna la vista automaticamente quando un altro dispositivo salva/modifica/cancella una nota
if (sb) {
  let _diaryRealtimeChannel = null;

  function _setupDiaryRealtime() {
    // Rimuovi canale esistente se presente
    if (_diaryRealtimeChannel) {
      sb.removeChannel(_diaryRealtimeChannel);
    }

    _diaryRealtimeChannel = sb.channel('vv-diary-realtime')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'notes' }, (payload) => {
        if (payload.eventType === 'INSERT') {
          if (!allNotes.find(n => n.id === payload.new.id)) {
            allNotes.push(payload.new);
            allNotes.sort((a, b) => a.note_date > b.note_date ? -1 : 1);
          }
        } else if (payload.eventType === 'UPDATE') {
          const idx = allNotes.findIndex(n => n.id === payload.new.id);
          if (idx !== -1) allNotes[idx] = payload.new;
          else { allNotes.push(payload.new); allNotes.sort((a, b) => a.note_date > b.note_date ? -1 : 1); }
        } else if (payload.eventType === 'DELETE') {
          const delId = payload.old?.id;
          if (delId) allNotes = allNotes.filter(n => n.id !== delId);
        }
        if (currentView === 'calendar') renderCalendar(); else renderList();
      })
      .subscribe((status, err) => {
        if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
          console.warn('[Diary] Realtime error:', status, err, '— riconnessione tra 5s');
          setTimeout(_setupDiaryRealtime, 5000);
        }
      });
  }

  _setupDiaryRealtime();
}

// ── FALLBACK AGGIORNAMENTO REAL-TIME ─────────────────────────────────────────
// Se il WebSocket Supabase si disconnette o non rileva aggiornamenti da altri
// dispositivi, aggiornamento completo quando la tab torna in primo piano.
{
  let _diaryVisDebounce = null;
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    clearTimeout(_diaryVisDebounce);
    _diaryVisDebounce = setTimeout(() => loadNotes(), 600);
  });
}

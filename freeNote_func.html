<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Voce Viva — Nota Libera</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VoceViva">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=EB+Garamond:ital,wght@1,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="vv-profile.js"></script>
<script src="vv-memory.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
[contenteditable] { background:transparent; }
:root { --bg:#0a0a0f; --surface:#111118; --border:#1e1e2e; --accent:#f55036; --text:#e8e8f0; --muted:#5a5a7a; --live:#4ade80; --warn:#f59e0b; }
body { min-height:100vh; background:var(--bg); color:var(--text); font-family:'JetBrains Mono',monospace; display:flex; flex-direction:column; align-items:center; -webkit-tap-highlight-color:transparent; }
body::before { content:''; position:fixed; inset:0; z-index:0; pointer-events:none; background:radial-gradient(ellipse 80% 50% at 5% 95%,rgba(245,80,54,.08) 0%,transparent 60%),radial-gradient(ellipse 50% 40% at 95% 5%,rgba(245,80,54,.05) 0%,transparent 60%); }

/* Error */
.error-msg { position:fixed; bottom:1rem; left:1rem; right:1rem; z-index:300; background:rgba(240,106,106,.08); border:1px solid rgba(240,106,106,.25); border-radius:.6rem; padding:.65rem .85rem; font-size:.68rem; color:#f06a6a; line-height:1.6; display:none; }
.error-msg.show { display:block; }

/* Processing pill */
.processing-pill { display:none; background:rgba(245,80,54,.12); border:1px solid rgba(245,80,54,.25); border-radius:2rem; padding:.25rem .65rem; font-size:.58rem; color:var(--accent); text-transform:uppercase; letter-spacing:.1em; align-items:center; gap:.35rem; }
.processing-pill.show { display:flex; }
.pill-dot { width:4px; height:4px; border-radius:50%; background:var(--accent); animation:blink .6s ease-in-out infinite; }

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes pulse { 0%,100%{box-shadow:0 6px 36px rgba(192,57,43,.55)} 50%{box-shadow:0 6px 50px rgba(192,57,43,.85),0 0 0 10px rgba(192,57,43,.1)} }
@keyframes spin { to{transform:rotate(360deg)} }
@keyframes wave { 0%,100%{height:3px} 50%{height:16px} }
.spinner { width:15px; height:15px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }

/* Formatting toolbar */
.fmt-toolbar { display:flex; align-items:center; gap:.2rem; flex-wrap:nowrap; justify-content:space-between; width:100%; }
.fmt-btn { background:none; border:1px solid var(--border); color:var(--muted); padding:.3rem 0; border-radius:.4rem; font-family:'JetBrains Mono',monospace; font-size:.62rem; cursor:pointer; touch-action:manipulation; transition:all .12s; white-space:nowrap; line-height:1.4; user-select:none; -webkit-user-select:none; text-transform:uppercase; letter-spacing:.04em; flex:1; text-align:center; }
.fmt-btn:hover:not(.active) { background:var(--surface); color:var(--text); border-color:var(--border); }
.fmt-btn.active { background:rgba(245,80,54,.15); color:var(--accent); border-color:rgba(245,80,54,.45); }
.fmt-sep { width:1px; height:14px; background:var(--border); margin:0 2px; flex-shrink:0; }

/* ── OVERLAY LAYOUT (from guided diary) ── */
.guided-overlay { display:flex; position:fixed; inset:0; z-index:200; background:var(--bg); align-items:stretch; justify-content:center; }
.guided-card { background:var(--surface); border:none; border-radius:0; width:100%; max-width:100%; display:flex; flex-direction:column; animation:fadeIn .2s ease-out; height:100%; overflow:hidden; position:relative; }
.guided-fixed-top { flex-shrink:0; display:flex; flex-direction:column; gap:.55rem; padding:1rem 1.2rem .4rem; }
.guided-body { flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; gap:.55rem; padding:.2rem 1.2rem max(.6rem, env(safe-area-inset-bottom)); }
.guided-fixed-bottom { flex-shrink:0; display:flex; flex-direction:column; gap:.4rem; padding:.5rem 1.2rem; padding-bottom:max(1rem, env(safe-area-inset-bottom)); border-top:1px solid var(--border); background:var(--surface); }
.guided-header { display:flex; justify-content:space-between; align-items:flex-start; gap:.5rem; }
.guided-header-left { display:flex; flex-direction:column; gap:.2rem; flex:1; min-width:0; }
.guided-title { font-family:'DM Serif Display',serif; font-size:1.1rem; color:var(--text); }
.guided-progress { font-size:.55rem; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); }
.guided-close { background:none; border:1px solid var(--border); color:var(--muted); width:30px; height:30px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:.85rem; transition:all .15s; flex-shrink:0; }
.guided-close:hover { border-color:var(--accent); color:var(--accent); }
.guided-header-actions { display:flex; align-items:center; gap:.35rem; flex-shrink:0; }
.guided-edit-btn { background:none; border:1px solid var(--border); color:var(--muted); padding:.32rem .6rem; border-radius:.4rem; font-family:'JetBrains Mono',monospace; font-size:.57rem; text-transform:uppercase; letter-spacing:.08em; cursor:pointer; touch-action:manipulation; transition:all .15s; white-space:nowrap; flex-shrink:0; }
.guided-edit-btn:hover { border-color:var(--accent); color:var(--accent); }

/* Keyboard compact mode */
.guided-card.kbd .guided-fixed-top { padding:.3rem 1.2rem .2rem; gap:0; }
.guided-card.kbd .guided-header-left { gap:0; }
.guided-card.kbd .guided-title { display:none; }
.guided-card.kbd .fn-wordcount { display:none; }
.guided-card.kbd #meterSection { display:none !important; }
.guided-card.kbd .guided-body { gap:.25rem; padding-bottom:.25rem; flex:1; min-height:0; }
.guided-card.kbd .guided-editor-wrap { flex:1; min-height:80px; height:auto; }
.guided-card.kbd .guided-mic-status { display:none; }
.guided-card.kbd .guided-fixed-bottom { padding:.35rem 1.2rem .35rem; }
.guided-card.kbd .box-label { display:none; }
.guided-card.kbd .fn-timer-row { display:none !important; }
.guided-card.kbd .input-mode-toggle { display:none; }

/* Floating REC FAB */
.guided-fab-rec { display:none; position:absolute; bottom:calc(var(--guided-bottom-h, 64px) + .75rem); right:1.2rem; width:44px; height:44px; border-radius:50%; border:none; background:var(--accent); color:#fff; cursor:pointer; align-items:center; justify-content:center; box-shadow:0 4px 18px rgba(245,80,54,.45); touch-action:manipulation; transition:opacity .2s,transform .2s; z-index:10; }
.guided-fab-rec svg { width:20px; height:20px; }
.guided-fab-rec.visible { display:flex; }
.guided-fab-rec.recording { background:#c0392b; animation:pulse 1.4s ease-in-out infinite; }

/* Inline mic in nav */
.guided-mic-nav { border-radius:.45rem !important; width:auto !important; height:auto !important; padding:.42rem .7rem !important; box-shadow:0 2px 10px rgba(245,80,54,.3) !important; flex:0 0 auto !important; }
.guided-mic-btn { width:44px; height:44px; border-radius:50%; border:none; background:var(--accent); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform .12s,box-shadow .25s; box-shadow:0 4px 16px rgba(245,80,54,.35); touch-action:manipulation; }
.guided-mic-btn:active { transform:scale(.92); }
.guided-mic-btn.recording { background:#c0392b; animation:pulse 1.4s ease-in-out infinite; }
.guided-mic-btn svg { width:20px; height:20px; }
.guided-mic-btn.photo-mode { background:var(--accent); color:#fff; box-shadow:0 4px 16px rgba(245,80,54,.45); border:none; animation:none; }
.guided-mic-btn.allegato-mode { background:var(--accent); color:#fff; box-shadow:0 4px 16px rgba(245,80,54,.45); border:none; animation:none; }
.guided-mic-status { font-size:.55rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); display:flex; align-items:center; gap:.35rem; min-height:1rem; }
.guided-mic-status .pill-dot { width:4px; height:4px; border-radius:50%; background:var(--accent); animation:blink .6s ease-in-out infinite; }

/* Nav */
.guided-nav { display:flex; gap:.3rem; width:100%; }
.guided-nav-btn { flex:1; padding:.5rem; border-radius:.5rem; font-family:'JetBrains Mono',monospace; font-size:.62rem; text-transform:uppercase; letter-spacing:.08em; cursor:pointer; touch-action:manipulation; text-align:center; transition:all .15s; }
.guided-continue { background:var(--live); border:1px solid var(--live); color:#0a0a0f; flex:1; font-weight:500; display:flex; align-items:center; justify-content:center; gap:.4rem; }
.guided-continue:hover { opacity:.9; }
.guided-continue:disabled { opacity:.3; cursor:not-allowed; }

/* Editor */
.guided-editor-wrap { flex:1; min-height:100px; display:flex; flex-direction:column; background:var(--bg); border:1px solid var(--border); border-radius:.8rem; padding:.8rem 0 .8rem .8rem; transition:border-color .2s; overflow:visible; position:relative; }
.guided-editor-wrap:focus-within { border-color:rgba(245,80,54,.4); }
.guided-editor-wrap.recording { border-color:rgba(240,106,106,.5); }
.guided-editor-wrap.done { border-color:rgba(74,222,128,.4); }
.guided-editor { background:transparent; border:none; color:var(--text); font-family:'Crimson Pro',Georgia,serif; font-size:1.05rem; line-height:1.85; outline:none; width:100%; min-height:60px; flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-right:.8rem; padding-top:18px; caret-color:var(--accent); scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.18) transparent; }
.guided-editor::-webkit-scrollbar { width:3px; }
.guided-editor::-webkit-scrollbar-track { background:transparent; }
.guided-editor::-webkit-scrollbar-thumb { background:rgba(255,255,255,.18); border-radius:2px; }
.guided-editor::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,.35); }
.guided-editor:empty::before { content:attr(data-placeholder); color:var(--muted); pointer-events:none; display:block; }
.guided-editor p { margin-bottom:.35rem; }
.guided-editor strong { color:#fff; font-weight:600; }
.guided-editor em { color:#fff; font-style:italic; font-family:'EB Garamond',Georgia,serif; }
.guided-editor ul, .guided-editor ol { margin:.3em 0 .3em 1.5em; padding:0; }
.guided-editor li { margin:.15em 0; }
.guided-editor h1 { font-family:'Crimson Pro',Georgia,serif; font-size:1.7em; font-weight:500; color:#ffffff; line-height:1.3; margin:.1em 0 .5em; letter-spacing:.04em; border-bottom:1px solid var(--border); padding-bottom:.3em; }
.guided-editor h2 { font-family:'Crimson Pro',Georgia,serif; font-size:1.35em; font-weight:500; color:#dddddd; line-height:1.35; margin:.9em 0 .4em; letter-spacing:.03em; }
.guided-editor h3 { font-family:'Crimson Pro',Georgia,serif; font-size:1.1em; font-weight:500; color:#bbbbbb; line-height:1.4; margin:.8em 0 .3em; letter-spacing:.02em; }
.guided-editor-fmt { margin-top:.4rem; }
.guided-editor-fmt .fmt-btn { color:#a8a8cc; border-color:#3c3c58; }
.guided-editor-fmt .fmt-btn:hover:not(.active) { color:#d0d0e8; border-color:#5a5a80; background:rgba(255,255,255,.05); }
.guided-editor-fmt .fmt-sep { background:#3c3c58; }

/* Editor action buttons floating inside wrap */
.fn-copy-btn { background:rgba(10,10,15,.7); border:1px solid var(--border); color:var(--muted); width:28px; height:28px; padding:0; border-radius:.35rem; cursor:pointer; display:flex; align-items:center; justify-content:center; touch-action:manipulation; transition:border-color .15s,color .15s,background .15s; line-height:1; backdrop-filter:blur(4px); }
.fn-copy-btn:hover { border-color:var(--accent); color:var(--accent); }
.fn-copy-btn:disabled { opacity:.3; cursor:not-allowed; pointer-events:none; }
.fn-copy-btn.copied { border-color:var(--live); color:var(--live); }
.fn-clear-btn { background:rgba(10,10,15,.7); border:1px solid var(--border); color:var(--muted); width:28px; height:28px; padding:0; border-radius:.35rem; cursor:pointer; display:flex; align-items:center; justify-content:center; touch-action:manipulation; transition:all .15s; backdrop-filter:blur(4px); }
.fn-clear-btn:hover { border-color:var(--accent); color:var(--accent); }
.fn-clear-btn:disabled { opacity:.3; cursor:not-allowed; pointer-events:none; }
.fn-editor-btns { position:absolute; top:.45rem; right:.45rem; z-index:5; display:flex; gap:.28rem; }
/* Correggi button (same row as copy/clear) */
.fn-correggi-btn { background:rgba(245,158,11,.12); border:1px solid rgba(245,158,11,.4); color:var(--warn); height:28px; padding:0 .45rem; border-radius:.35rem; cursor:pointer; display:none; align-items:center; justify-content:center; touch-action:manipulation; transition:all .15s; backdrop-filter:blur(4px); font-family:'JetBrains Mono',monospace; font-size:.52rem; text-transform:uppercase; letter-spacing:.06em; gap:.25rem; white-space:nowrap; }
.fn-correggi-btn.visible { display:flex; }
.fn-correggi-btn:hover, .fn-correggi-btn.active { background:rgba(245,158,11,.2); border-color:rgba(245,158,11,.6); color:var(--warn); }

/* Modal input (date) */
.modal-input { background:var(--bg); border:1px solid var(--border); border-radius:.6rem; color:var(--text); font-family:'JetBrains Mono',monospace; font-size:.78rem; padding:.55rem .7rem; outline:none; transition:border-color .2s; width:100%; color-scheme:dark; }
.modal-input:focus { border-color:var(--accent); }
#noteTitleInput { resize:none; overflow:hidden; field-sizing:content; min-height:2.2rem; max-width:100%; box-sizing:border-box; word-break:break-word; }

/* ── NOTA LIBERA SPECIFIC ── */

/* Meter (replaces progress bar) */
.meter-row { display:flex; align-items:center; gap:.6rem; }
.meter-label { font-size:.55rem; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); white-space:nowrap; }
.meter-bar { flex:1; height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
.meter-fill { height:100%; width:0%; background:var(--live); border-radius:2px; transition:width .08s linear,background .2s; }
.meter-fill.warn { background:var(--warn); }
.meter-fill.loud { background:var(--accent); }
.quality-badge { font-size:.55rem; text-transform:uppercase; letter-spacing:.1em; padding:.15rem .5rem; border-radius:.3rem; border:1px solid var(--border); color:var(--muted); white-space:nowrap; transition:all .3s; min-width:52px; text-align:center; }
.quality-badge.good { border-color:rgba(74,222,128,.4); color:var(--live); }
.quality-badge.ok { border-color:rgba(245,158,11,.4); color:var(--warn); }
.quality-badge.low { border-color:rgba(245,80,54,.4); color:var(--accent); }

/* Box label / dots */
.box-label { font-size:.58rem; text-transform:uppercase; letter-spacing:.15em; color:var(--muted); margin-bottom:.4rem; display:flex; align-items:center; gap:.5rem; }
.live-dot { width:5px; height:5px; border-radius:50%; background:var(--muted); flex-shrink:0; transition:background .3s; }
.live-dot.on { background:#f06a6a; animation:blink .8s ease-in-out infinite; }
.live-dot.processing { background:var(--accent); animation:blink .5s ease-in-out infinite; }
.live-dot.done { background:var(--live); animation:none; }

/* Word count & clear row */
.word-count { font-size:.58rem; color:var(--muted); line-height:1; }

/* Mic expanding switcher */
.guided-mic-nav-wrap { position:relative; display:flex; align-items:center; justify-content:center; }
.fn-mic-switcher { display:flex; align-items:stretch; justify-content:center; border-radius:.45rem; overflow:hidden; position:relative; transition:all .32s cubic-bezier(.4,0,.2,1); }
.fn-mic-switcher .fn-sw-side { width:0; overflow:hidden; opacity:0; display:flex; align-items:center; justify-content:center; transition:width .32s cubic-bezier(.4,0,.2,1), opacity .22s ease; cursor:pointer; touch-action:manipulation; border:none; border-left:1px solid rgba(255,255,255,.1); border-right:1px solid rgba(255,255,255,.1); background:rgba(245,80,54,.10); color:var(--accent); flex-shrink:0; padding:0; }
.fn-mic-switcher .fn-sw-side:first-child { border-left:none; }
.fn-mic-switcher .fn-sw-side:last-of-type { border-right:none; }
.fn-mic-switcher .fn-sw-side svg { width:18px; height:18px; flex-shrink:0; pointer-events:none; }
.fn-mic-switcher.expanded .fn-sw-side { width:44px; opacity:1; }
.fn-mic-switcher.expanded .fn-sw-side:active { background:rgba(245,80,54,.25); }
.fn-mic-switcher .fn-sw-side, .fn-mic-switcher .guided-mic-btn { position:relative; z-index:2; }
/* shrink side buttons for AI/Save when open */
.guided-nav.switcher-open .fn-ai-btn { min-width:0; padding-left:.35rem; padding-right:.35rem; }
.guided-nav.switcher-open .guided-continue { min-width:0; padding-left:.35rem; padding-right:.35rem; }
.guided-nav .fn-ai-btn, .guided-nav .guided-continue { transition:padding .32s cubic-bezier(.4,0,.2,1), min-width .32s cubic-bezier(.4,0,.2,1); }

/* AI button in nav (replaces "rispondi dopo") */
.fn-ai-btn { background:rgba(245,158,11,.12); border:1px solid rgba(245,158,11,.4); color:var(--warn); font-weight:500; display:flex; align-items:center; justify-content:center; gap:.4rem; }
.fn-ai-btn:hover { background:rgba(245,158,11,.2); }
.fn-ai-btn:active { background:none; border-color:var(--border); color:var(--muted); }
.fn-ai-btn:disabled { opacity:.5; cursor:not-allowed; }

/* Status */
.status-row { display:flex; align-items:center; gap:.45rem; font-size:.65rem; color:var(--muted); text-transform:uppercase; letter-spacing:.12em; }
.status-dot { width:6px; height:6px; border-radius:50%; background:var(--muted); transition:background .3s; }
.status-dot.live { background:#f06a6a; animation:blink .8s ease-in-out infinite; }
.status-dot.processing { background:var(--accent); animation:blink .5s ease-in-out infinite; }
.status-dot.done { background:var(--live); animation:none; }

/* Timer row */
.fn-timer-row { display:none; align-items:center; gap:.6rem; }
.fn-timer-row.show { display:flex; }
.timer { font-size:2rem; font-weight:300; letter-spacing:.06em; font-variant-numeric:tabular-nums; font-family:'JetBrains Mono',monospace; line-height:1; }
.waveform { display:flex; align-items:center; gap:2px; height:18px; }
.bar { width:2px; background:#f06a6a; border-radius:2px; height:3px; }
.bar.active { animation:wave .7s ease-in-out infinite; }
.bar:nth-child(1){animation-delay:.00s}.bar:nth-child(2){animation-delay:.10s}.bar:nth-child(3){animation-delay:.20s}
.bar:nth-child(4){animation-delay:.30s}.bar:nth-child(5){animation-delay:.15s}.bar:nth-child(6){animation-delay:.05s}
.bar:nth-child(7){animation-delay:.25s}

/* Input mode toggle */
.input-mode-toggle { display:flex; gap:.2rem; background:var(--bg); border:1px solid var(--border); border-radius:2rem; padding:.2rem; }
.mode-toggle-btn { display:flex; align-items:center; gap:.3rem; background:none; border:none; border-radius:1.5rem; color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:.6rem; letter-spacing:.08em; text-transform:uppercase; padding:.32rem .7rem; cursor:pointer; transition:background .15s,color .15s; }
.mode-toggle-btn svg { width:13px; height:13px; flex-shrink:0; }
.mode-toggle-btn.active { background:var(--accent); color:#fff; }

/* Photo */
.photo-proc { display:none; font-size:.65rem; color:var(--accent); letter-spacing:.08em; align-items:center; gap:.4rem; }
.photo-proc.show { display:flex; }
.photo-proc .dot { width:7px;height:7px;border-radius:50%;background:var(--accent);animation:blink .6s ease-in-out infinite; }
.photo-feedback-section { display:none; flex-direction:column; gap:.4rem; padding:.6rem .75rem; background:var(--bg); border:1px solid var(--border); border-radius:0 0 .8rem .8rem; border-top:none; margin-top:-1px; }
.photo-feedback-section.show { display:flex; }

/* Output AI */
.output-box { background:var(--bg); border:1px solid var(--border); border-radius:1rem; padding:1.1rem; min-height:80px; position:relative; transition:border-color .3s; display:none; flex-shrink:0; overflow:hidden; }
.output-box.show { display:flex; flex-direction:column; }
.output-box.loading { border-color:rgba(245,80,54,.4); }
.output-box.done { border-color:rgba(74,222,128,.4); }
.output-overlay { display:none; position:absolute; inset:0; background:rgba(10,10,15,.8); border-radius:1rem; align-items:center; justify-content:center; gap:.65rem; font-size:.7rem; color:var(--accent); backdrop-filter:blur(3px); }
.output-overlay.show { display:flex; }
#outputText { font-size:1.05rem; line-height:1.85; color:var(--text); word-break:break-word; outline:none; font-family:'Crimson Pro',Georgia,serif; flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-right:.2rem; padding-top:18px; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.18) transparent; }
#outputText::-webkit-scrollbar { width:3px; }
#outputText::-webkit-scrollbar-track { background:transparent; }
#outputText::-webkit-scrollbar-thumb { background:rgba(255,255,255,.18); border-radius:2px; }
#outputText::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,.35); }
#outputText:focus { background:rgba(255,255,255,.02); border-radius:.4rem; padding:.2rem; }
#outputText p { margin-bottom:.65rem; }
#outputText ul { padding-left:1.1rem; margin-bottom:.65rem; }
#outputText li { margin-bottom:.35rem; }
#outputText h2 { font-family:'Crimson Pro',Georgia,serif; font-size:1.5em; font-weight:500; color:#ffffff; line-height:1.3; margin:.9rem 0 .4rem; letter-spacing:.04em; border-bottom:1px solid var(--border); padding-bottom:.3em; }
#outputText h3 { font-family:'Crimson Pro',Georgia,serif; font-size:1.2em; font-weight:500; color:#dddddd; line-height:1.35; margin:.9rem 0 .4rem; letter-spacing:.03em; }
#outputText h4 { font-family:'Crimson Pro',Georgia,serif; font-size:1.05em; font-weight:500; color:#bbbbbb; line-height:1.4; margin:.8rem 0 .3em; letter-spacing:.02em; }
#outputText strong { color:#ffffff; font-weight:600; }
#outputText em { color:#ffffff; font-style:italic; font-family:'EB Garamond',Georgia,serif; }

/* Output fmt toolbar */
.output-fmt-toolbar { display:flex; align-items:center; gap:.2rem; flex-wrap:nowrap; justify-content:space-between; width:100%; margin-bottom:.5rem; display:none; }
.output-fmt-toolbar.show { display:flex; }

/* Refine drawer */
.refine-drawer { display:none; flex-direction:column; gap:.45rem; flex-shrink:0; }
.refine-drawer.show { display:flex; }
.refine-drawer-stage { display:flex; flex-direction:column; align-items:center; gap:.45rem; }
.refine-drawer-handle { width:100%; background:var(--accent); color:#fff; border:none; border-radius:.65rem .65rem 0 0; padding:.55rem 1rem; display:flex; flex-direction:row; align-items:center; justify-content:center; gap:.5rem; cursor:pointer; touch-action:manipulation; user-select:none; -webkit-user-select:none; box-shadow:0 -2px 14px rgba(245,80,54,.28); transition:box-shadow .2s, opacity .15s; }
.refine-drawer-handle:hover { box-shadow:0 -2px 18px rgba(245,80,54,.42); }
.refine-drawer-handle:active { opacity:.88; }
.refine-drawer-handle svg { width:14px; height:14px; flex-shrink:0; transition:transform .32s cubic-bezier(.4,0,.2,1); }
.refine-drawer-label { font-size:.72rem; text-transform:uppercase; letter-spacing:.1em; font-family:'JetBrains Mono',monospace; }
.refine-drawer-handle.open { box-shadow:0 -2px 8px rgba(245,80,54,.18); }
.refine-drawer-handle.open svg { transform:rotate(180deg); }
.refine-drawer-body { width:100%; max-height:0; overflow:hidden; opacity:0; transform:translateY(-12px); transform-origin:bottom center; background:rgba(17,17,24,.96); border:1px solid rgba(245,80,54,.22); border-radius:1rem; padding:0 .85rem; transition:max-height .36s cubic-bezier(.4,0,.2,1), opacity .24s ease, transform .36s cubic-bezier(.4,0,.2,1), padding .36s cubic-bezier(.4,0,.2,1); }
.refine-drawer-body.open { max-height:220px; opacity:1; transform:translateY(0); padding:.85rem; }
.refine-input { width:100%; background:rgba(255,255,255,.04); border:1px solid var(--border); border-radius:.5rem; color:var(--text); font-family:'Crimson Pro',Georgia,serif; font-size:.95rem; line-height:1.6; padding:.5rem .7rem; resize:none; outline:none; min-height:60px; box-sizing:border-box; }
.refine-input:focus { border-color:var(--accent); }
.refine-input::placeholder { color:var(--muted); font-style:italic; }
.refine-row { display:flex; gap:.4rem; margin-top:.4rem; align-items:center; }
.btn-refine { flex:1; background:rgba(245,80,54,.12); border:1px solid rgba(245,80,54,.3); border-radius:.5rem; color:var(--accent); font-size:.75rem; padding:.4rem .6rem; cursor:pointer; text-align:center; }
.btn-refine:hover { background:rgba(245,80,54,.2); }
.btn-refine:disabled { opacity:.4; cursor:not-allowed; }
.refine-hint { font-size:.65rem; color:var(--muted); flex:1; }

/* Bottom / action */
.bottom-row { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.5rem; margin-top:.5rem; }
.btn-ghost { background:none; border:1px solid var(--border); color:var(--muted); padding:.38rem .8rem; border-radius:.5rem; font-family:'JetBrains Mono',monospace; font-size:.62rem; cursor:pointer; text-transform:uppercase; letter-spacing:.1em; touch-action:manipulation; }
.btn-ghost:disabled { opacity:.3; cursor:not-allowed; }
.btn-diary-save { background:var(--live); color:#0a0a0f; border:none; padding:.38rem .8rem; border-radius:.5rem; font-family:'JetBrains Mono',monospace; font-size:.62rem; cursor:pointer; text-transform:uppercase; letter-spacing:.1em; touch-action:manipulation; font-weight:500; }
.btn-ai { background:var(--accent); color:#fff; border:1px solid var(--accent); padding:.3rem .6rem; border-radius:.4rem; font-family:'JetBrains Mono',monospace; font-size:.62rem; cursor:pointer; touch-action:manipulation; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; line-height:1.4; text-align:center; }
.btn-ai:disabled { opacity:.5; cursor:not-allowed; }

/* Modal */
.modal-overlay { display:none; position:fixed; inset:0; z-index:300; background:rgba(0,0,0,.75); backdrop-filter:blur(6px); align-items:center; justify-content:center; padding:1rem; }
.modal-overlay.show { display:flex; }
.modal-card { background:var(--surface); border:1px solid var(--border); border-radius:1.2rem; padding:1.5rem; width:100%; max-width:480px; max-height:90vh; overflow-y:auto; display:flex; flex-direction:column; gap:1rem; animation:modalIn .2s ease-out; position:relative; }
@keyframes modalIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
.modal-title { font-family:'DM Serif Display',serif; font-size:1.2rem; color:var(--text); }
.modal-field { display:flex; flex-direction:column; gap:.3rem; }
.modal-label { font-size:.58rem; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); }
.modal-preview { background:var(--bg); border:1px solid var(--border); border-radius:.6rem; padding:.65rem .7rem; max-height:120px; overflow-y:auto; font-size:.72rem; line-height:1.7; color:var(--muted); }
.modal-preview::-webkit-scrollbar { width:3px; }
.modal-preview::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
.modal-actions { display:flex; gap:.5rem; justify-content:flex-end; }
.modal-btn { padding:.5rem 1rem; border-radius:.6rem; font-family:'JetBrains Mono',monospace; font-size:.68rem; cursor:pointer; touch-action:manipulation; border:none; }
.modal-btn-cancel { background:none; border:1px solid var(--border); color:var(--muted); }
.modal-btn-confirm { background:var(--live); color:#0a0a0f; font-weight:500; }
.modal-btn-confirm:disabled { opacity:.4; cursor:not-allowed; }
.modal-spinner { display:inline-block; width:12px; height:12px; border:2px solid rgba(10,10,15,.2); border-top-color:#0a0a0f; border-radius:50%; animation:spin .6s linear infinite; margin-right:.3rem; vertical-align:middle; }

/* ── CAROUSEL ── */
.fn-carousel { flex:1; min-height:0; overflow:hidden; position:relative; display:flex; flex-direction:column; }
.fn-carousel-track { display:flex; width:200%; height:100%; transition:transform .32s cubic-bezier(.4,0,.2,1); will-change:transform; }
.fn-panel { width:50%; height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; flex-shrink:0; display:flex; flex-direction:column; gap:.55rem; padding:.2rem 1.2rem max(.6rem, env(safe-area-inset-bottom)); box-sizing:border-box; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.18) transparent; }
.fn-panel::-webkit-scrollbar { width:3px; }
.fn-panel::-webkit-scrollbar-track { background:transparent; }
.fn-panel::-webkit-scrollbar-thumb { background:rgba(255,255,255,.18); border-radius:2px; }
.fn-panel::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,.35); }
#panelAI { overflow:hidden; padding-bottom:.2rem; }
#panelAI .box-label { flex-shrink:0; }
#panelAI .output-box { flex:1; min-height:0; overflow:hidden; margin-bottom:.1rem; }
/* Swipe handle */
.fn-swipe-handle { position:absolute; right:0; top:50%; transform:translateY(-50%); z-index:10; display:none; }
.fn-swipe-handle.show { display:flex; }
.fn-swipe-tab { background:var(--accent); color:#fff; border-radius:.5rem 0 0 .5rem; padding:.7rem .38rem; display:flex; flex-direction:column; align-items:center; gap:.35rem; cursor:pointer; touch-action:none; user-select:none; -webkit-user-select:none; box-shadow:-2px 0 14px rgba(245,80,54,.4); transition:opacity .15s; }
.fn-swipe-tab:active { opacity:.8; }
.fn-swipe-icon { width:14px; height:14px; flex-shrink:0; transition:transform .3s; }
.fn-swipe-label { font-size:.48rem; text-transform:uppercase; letter-spacing:.1em; font-family:'JetBrains Mono',monospace; writing-mode:vertical-rl; text-orientation:mixed; display:flex; align-items:center; justify-content:center; }
/* kbd compact override for panels */
.guided-card.kbd .fn-panel { gap:.25rem; padding-bottom:.25rem; }
.guided-card.kbd #panelAI .output-box { margin-bottom:0; }
</style>
</head>
<body>

<!-- ERROR MSG -->
<div class="error-msg" id="errorMsg"></div>

<!-- NOTA LIBERA OVERLAY -->
<div class="guided-overlay" id="freeNoteOverlay" style="display:flex;">
  <div class="guided-card">
    <div class="guided-fixed-top">
    <div class="guided-header">
      <div class="guided-header-left">
        <div class="guided-title">Nota <em style="color:var(--accent);font-style:italic;">Libera</em></div>

          <div style="flex:1;min-width:0;">
            <label style="font-size:.55rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);">Titolo</label>
            <textarea id="noteTitleInput" class="modal-input" style="margin-top:.15rem;" placeholder="Titolo nota&hellip;" rows="1"></textarea>
          </div>
        </div>
        <div style="margin-top:.3rem;display:flex;align-items:flex-end;gap:.5rem;">
          <div>
            <label style="font-size:.55rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);">Data</label>

              <div class="bar"></div><div class="bar"></div><div class="bar"></div>
              <div class="bar"></div><div class="bar"></div><div class="bar"></div>
              <div class="bar"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="guided-header-actions">
        <button class="guided-close" id="closeBtn">&#x2715;</button>
      </div>
    </div>
    <!-- METER (replaces progress bar) -->
    <div id="meterSection" style="display:none">
      <div class="meter-row">
        <span class="meter-label">Livello</span>
        <div class="meter-bar"><div class="meter-fill" id="meterFill"></div></div>
        <span class="quality-badge" id="qualityBadge">&mdash;</span>
      </div>
    </div>
    </div>

    <!-- FAB REC: visible on scroll when keyboard is open -->
    <button class="guided-fab-rec" id="fabRec" title="Registra">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>

    <div class="fn-carousel" id="fnCarousel">
      <div class="fn-carousel-track" id="fnCarouselTrack">
      <!-- Panel 0: Editor -->
      <div class="fn-panel" id="panelEditor">
    <!-- Editor label -->
    <div class="box-label">
      <span class="live-dot" id="liveDot"></span>
      <span id="annotLabel">Annotazione</span>
      <span class="word-count" id="wordCountInline" style="margin-left:.3rem;">0 parole</span>
      <div class="processing-pill" id="processingPill"><span class="pill-dot"></span> trascrivo&hellip;</div>
      <div class="photo-proc" id="photoProcPill" style="margin-left:.2rem;"><span class="dot"></span> analizzo foto...</div>
    </div>

    <!-- Editor -->
    <div class="guided-editor-wrap" id="annotWrap">
      <div class="fn-editor-btns">
        <button class="fn-correggi-btn" id="correggiBtn" title="Correggi trascrizione">
          <svg viewBox="0 0 24 24" fill="none" style="width:13px;height:13px;flex-shrink:0" aria-hidden="true"><path d="M12 2C12 2 8.5 7.5 2 12C8.5 16.5 12 22 12 22C12 22 15.5 16.5 22 12C15.5 7.5 12 2 12 2Z" fill="currentColor" opacity="0.9"/><path d="M12 2C12 2 15.5 7.5 22 12C15.5 16.5 12 22 12 22" fill="currentColor" opacity="0.4"/></svg>
          Correggi
        </button>
        <button class="fn-clear-btn" id="clearBtn" disabled title="Cancella">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </button>
        <button class="fn-copy-btn" id="copyBtn" title="Copia testo" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
      </div>
      <div class="guided-editor" id="annotEditor" contenteditable="true" spellcheck="true"
        data-placeholder="Scrivi qui o usa il microfono per dettare. Puoi mescolare testo scritto e dettato liberamente."></div>

    <div class="photo-feedback-section" id="photoFeedbackSection">
      <textarea id="photoFeedbackInput" style="width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:.5rem;color:var(--text);font-family:'Crimson Pro',Georgia,serif;font-size:.9rem;line-height:1.6;padding:.5rem .7rem;resize:none;outline:none;min-height:52px;box-sizing:border-box;" placeholder="Correzioni&hellip; es. &quot;le frecce &rarr; non sono LO&quot;, &quot;il titolo principale &egrave;&hellip;&quot;"></textarea>
      <button id="photoRefineBtn" class="btn-ai" style="display:block;width:100%;margin-top:.1rem;">&#10227; Rianalizza trascrizione</button>
    </div>

      </div><!-- /panelEditor -->

      <!-- Panel 1: AI Output -->
      <div class="fn-panel" id="panelAI">

            </button>
            <button class="fn-copy-btn" id="copyAiBtn" disabled title="Copia testo">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
          </div>
          <div class="output-overlay" id="outputOverlay"><div class="spinner"></div> <span id="overlayText">Elaborazione&hellip;</span></div>
          <div id="outputText" contenteditable="true" spellcheck="true"></div>

      </div><!-- /fn-carousel-track -->

          <span class="fn-swipe-label" id="swipeLabel">AI</span>
        </div>
      </div>

    </div><!-- /fn-carousel -->

    <div class="guided-fixed-bottom" id="fixedBottom">
    <div class="refine-drawer" id="refineDrawer">
      <div class="refine-drawer-stage">
        <div class="refine-drawer-body" id="refineDrawerBody">
          <textarea class="refine-input" id="refineInput" placeholder="Scrivi un feedback&hellip; es. &quot;approfondisci il tema della solitudine&quot;, &quot;rimuovi la parte sui libri&quot;, &quot;pi&ugrave; conciso&quot;"></textarea>

        </div>

async function transcribeBlob(blob) {

      const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', { method: 'POST', cache: 'no-store', headers: { 'Authorization': 'Bearer ' + GROQ_KEY }, body: form });
      if (res.status === 429) { const w = parseInt(res.headers.get('retry-after') || '60', 10); const ed = await res.json().catch(() => ({})); const m = ed?.error?.message || ''; const match = m.match(/try again in (\d+)m(\d+)s/) || m.match(/try again in (\d+)s/); let ws = w; if (match && match.length === 3) ws = parseInt(match[1]) * 60 + parseInt(match[2]); else if (match && match.length === 2) ws = parseInt(match[1]); await waitWithCountdown(Math.min(ws, 300), 'Rate limit \u2013 riprovo tra'); a--; continue; }
      if (!res.ok) { const e = await res.json().catch(() => {}); throw new Error(e?.error?.message || 'HTTP ' + res.status); }
      hideErr(); const raw = (await res.text()).trim(); const txt = raw.replace(/\.{2,}/g, '').replace(/\u2026/g, '').replace(/\s{2,}/g, ' ').trim();
      const isHallucination = /non scrivere|non inventare|non aggiungere|non interpretare|non completare|trascrivi esattamente|se non senti|sottotitol|grazie per (aver|la)|iscriviti al canale|alla prossima/i.test(txt);
      if (txt && txt !== '[BLANK_AUDIO]' && txt.length > 1 && !isHallucination) {
        const cur = getEditorText(); const np = deduplicateOverlap(cur, txt);
        if (np) { annotEditor.focus(); const sel = window.getSelection(), range = document.createRange(); range.selectNodeContents(annotEditor); range.collapse(false); sel.removeAllRanges(); sel.addRange(range); const prefix = cur && !/\s$/.test(annotEditor.innerText) ? ' ' : ''; const tn = document.createTextNode(prefix + np); range.insertNode(tn); range.setStartAfter(tn); range.collapse(true); sel.removeAllRanges(); sel.addRange(range); aLastRange = range.cloneRange(); _hasRec = true; updateWords(); annotEditor.scrollTop = annotEditor.scrollHeight; }

      return;
    } catch(e) { if (a === 4) showErr('Trascrizione: ' + e.message); }
  }
}

// ── RNNOISE ──────────────────────────────────────────────────────────────────
async function applyRNNoise(blob) {
  try {
    const arrayBuf = await blob.arrayBuffer(); const tmpCtx = new OfflineAudioContext(1, 1, 48000); const decoded = await tmpCtx.decodeAudioData(arrayBuf);
    const sr = decoded.sampleRate, raw = decoded.getChannelData(0); const frameSize = 480;

    const resampled = (await outCtx.startRendering()).getChannelData(0); const frames = Math.floor(resampled.length / frameSize);
    const output = new Float32Array(frames * frameSize); const framePtr = rnnoiseModule._malloc(frameSize * 4);

    rnnoiseModule._free(framePtr); const outBuf = new AudioBuffer({ numberOfChannels: 1, length: output.length, sampleRate: 48000 }); outBuf.copyToChannel(output, 0); return await audioBufferToWav(outBuf);
  } catch(e) { return blob; }
}

async function audioBufferToWav(buffer) {
  const sr = buffer.sampleRate, n = buffer.length, ch = buffer.numberOfChannels; const data = buffer.getChannelData(0);
  const int16 = new Int16Array(n); for (let i = 0; i < n; i++) int16[i] = Math.max(-32768, Math.min(32767, data[i] * 32767));
  const buf = new ArrayBuffer(44 + n * 2); const v = new DataView(buf);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); ws(8, 'WAVE'); ws(12, 'fmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, ch, true); v.setUint32(24, sr, true); v.setUint32(28, sr * ch * 2, true);
  v.setUint16(32, ch * 2, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, n * 2, true);

// ── PHOTO ANALYSIS ───────────────────────────────────────────────────────────
async function analyzePhoto(base64, feedbackHistory) {
  const GROQ = localStorage.getItem('vv_groq') || ''; if (!GROQ) throw new Error('Chiave Groq non trovata.');
  const systemPrompt = 'Sei un trascrittore preciso di appunti scritti a mano in italiano.\nIl tuo unico compito \u00e8 trascrivere fedelmente il contenuto visibile nella foto.\n\nREGOLE ASSOLUTE:\n1. Trascrivi TUTTO il testo visibile esattamente come scritto, rispettando gerarchia e struttura\n2. Usa markdown: # per titoli principali, ## per sottotitoli, ### per sezioni minori\n3. Usa - per elenchi puntati, 1. 2. 3. per elenchi numerati\n4. Per schemi con frecce: descrivi i nodi e le connessioni con \u2192\n5. NON interpretare, NON riassumere, NON aggiungere nulla che non sia scritto\n6. Alla fine indica su riga separata: SCHEMA: s\u00ec oppure SCHEMA: no';
  const messages = [{ role: 'user', content: [{ type: 'image_url', image_url: { url: 'data:image/jpeg;base64,' + base64 } }, { type: 'text', text: 'Trascrivi questo appunto.' }] }];
  if (feedbackHistory && feedbackHistory.length > 0) {
    const first = feedbackHistory[0]; if (first.transcription) messages.push({ role: 'assistant', content: first.transcription });
    feedbackHistory.forEach((fb, i) => { if (i === 0 && !fb.feedback) return; if (fb.feedback) messages.push({ role: 'user', content: 'Correzione: ' + fb.feedback }); if (fb.response) messages.push({ role: 'assistant', content: fb.response }); });
    messages.push({ role: 'user', content: 'Rianalizza la foto applicando tutte le correzioni indicate.' });
  }
  const res = await fetch('https://api.groq.com/openai/v1/chat/completions', { method: 'POST', cache: 'no-store', headers: { 'Authorization': 'Bearer ' + GROQ, 'Content-Type': 'application/json' }, body: JSON.stringify({ model: 'meta-llama/llama-4-scout-17b-16e-instruct', max_tokens: 2000, temperature: 0.05, messages: [{ role: 'system', content: systemPrompt }, ...messages] }) });
  if (!res.ok) throw new Error('Errore API Groq: ' + res.status); const data = await res.json(); return data?.choices?.[0]?.message?.content?.trim() || '';
}

  return new Promise(resolve => { const reader = new FileReader(); reader.onload = e => { const img = new Image(); img.onload = () => { let w = img.width, h = img.height; if (w > maxPx || h > maxPx) { if (w > h) { h = Math.round(h * maxPx / w); w = maxPx; } else { w = Math.round(w * maxPx / h); h = maxPx; } } const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); resolve(c.toDataURL('image/jpeg', quality).split(',')[1]); }; img.src = e.target.result; }; reader.readAsDataURL(file); });

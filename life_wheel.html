<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Life Wheel — Voce Viva</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="vv-auth.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0a0f; --surface: #111118; --border: #1e1e2e;
  --accent: #f55036; --text: #e8e8f0; --muted: #5a5a7a;
}
body {
  min-height: 100vh; background: var(--bg); color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  display: flex; flex-direction: column; align-items: center;
  padding: 1.5rem 1rem 4rem; -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: none;
}
.container {
  position: relative; z-index: 1; width: 100%; max-width: 640px;
  display: flex; flex-direction: column; gap: 1.4rem;
}
/* Header */
.header-row { display: flex; align-items: center; justify-content: space-between; }
.back-btn {
  background: none; border: 1px solid var(--border); border-radius: .5rem;
  color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: .62rem;
  padding: .4rem .65rem; cursor: pointer; display: flex; align-items: center; gap: .35rem;
  transition: border-color .2s, color .2s; text-decoration: none;
}
.back-btn:hover { border-color: var(--accent); color: var(--accent); }
.page-title { font-family: 'DM Serif Display', serif; font-size: 1.15rem; letter-spacing: -.02em; }
.page-title em { font-style: italic; color: var(--accent); }

/* Sphere section */
.sphere-outer { display: flex; justify-content: center; }
.sphere-wrap {
  position: relative;
  width: min(300px, calc(100vw - 3rem));
  height: min(300px, calc(100vw - 3rem));
  flex-shrink: 0;
}
#sphereCanvas {
  position: absolute;
}
.sphere-ring {
  position: absolute; inset: 0; border-radius: 50%;
  border: 1px solid rgba(255,255,255,.05); pointer-events: none;
}
/* Labels around sphere */
.sphere-label {
  position: absolute; display: flex; flex-direction: column; align-items: center; gap: 3px;
  cursor: pointer; transform: translate(-50%, -50%); transition: opacity .2s; z-index: 2;
}
.sphere-label:hover { opacity: .7; }
.sphere-label-dot {
  width: 8px; height: 8px; border-radius: 50%; border: 2px solid;
}
.sphere-label-text {
  font-size: .47rem; text-transform: uppercase; letter-spacing: .1em;
  white-space: nowrap; max-width: 62px; overflow: hidden;
  text-overflow: ellipsis; text-align: center;
}
/* Add button on sphere border */
.sphere-add-btn {
  position: absolute; width: 26px; height: 26px; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--muted); font-size: 1.05rem; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transform: translate(-50%, -50%);
  transition: border-color .2s, color .2s, background .2s; padding: 0; z-index: 2;
}
.sphere-add-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(245,80,54,.08); }

/* Section label */
.section-label { font-size: .55rem; text-transform: uppercase; letter-spacing: .16em; color: var(--muted); }

/* Life area cards */
.areas-grid {
  display: flex;
  flex-direction: column;
  gap: .75rem;
}
/* Row that contains handle-edit | swipe-wrap | handle-del */
.area-card-row {
  display: flex;
  align-items: stretch;
  gap: 0;
  position: relative;
  z-index: 1;
}
.area-card-handle {
  flex-shrink: 0;
  width: 28px;
  background: var(--surface);
  border: 1px solid var(--border);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted, #888);
  transition: background .2s, color .2s;
}
/* Left handle = EDIT — always lit with area color */
.area-card-handle-edit {
  border-radius: .75rem 0 0 .75rem;
  border-right: none;
  border-left: 3px solid var(--area-color);
  background: color-mix(in srgb, var(--area-color) 12%, transparent);
  color: var(--area-color);
  opacity: 1;
}
.area-card-handle-edit:hover { background: color-mix(in srgb, var(--area-color) 28%, transparent); }
/* Right handle = DELETE */
.area-card-handle-del {
  border-radius: 0 .75rem .75rem 0;
  border-left: none;
}
.area-card-handle-del:hover { background: #f06a6a18; color: #f06a6a; }
.area-card-swipe-wrap { flex: 1; min-width: 0; }
/* Flatten card sides that are joined to handles */
.area-card-row .area-card-swipe-wrap { border-radius: 0; }
.area-card-row .area-card-swipe-wrap .area-card {
  border-radius: 0;
  border-left: none;
  border-right: none;
}
.area-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: .75rem; padding: .9rem;
  display: flex; flex-direction: column; gap: .55rem;
  border-left: 3px solid var(--area-color);
  cursor: pointer;
  transition: border-color .2s;
}
.area-card-header { display: flex; align-items: center; gap: .35rem; }
.area-card-chevron {
  background: none; border: none; color: var(--muted);
  cursor: pointer; padding: 0 .1rem; flex-shrink: 0;
  display: flex; align-items: center; transition: color .15s, transform .2s;
  transform: rotate(0deg);
}
.area-card.expanded .area-card-chevron { transform: rotate(90deg); }
.area-card-chevron:hover { color: var(--text); }
.area-card-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--area-color); flex-shrink: 0; }
.area-card-name {
  flex: 1; background: none; border: none;
  border-bottom: 1px solid transparent;
  color: var(--text); font-family: 'JetBrains Mono', monospace;
  font-size: .78rem; text-transform: uppercase; letter-spacing: .1em;
  outline: none; min-width: 0; padding: .1rem 0;
  transition: border-color .2s;
}
.area-card-name:focus { border-bottom-color: var(--area-color); }
.area-card-name::placeholder { color: var(--muted); }
.area-card-del {
  background: none; border: none; color: var(--muted);
  font-size: .78rem; cursor: pointer; padding: 0 .1rem;
  transition: color .15s; line-height: 1; flex-shrink: 0;
}
.area-card-del:hover { color: #f06a6a; }
.area-card-edit-btn {
  background: none; border: none; color: var(--muted);
  cursor: pointer; padding: 0 .15rem; line-height: 1; flex-shrink: 0;
  transition: color .15s; display: flex; align-items: center;
}
.area-card-edit-btn:hover { color: var(--text); }
.area-card-edit-btn.editing { color: var(--area-color); }
.area-card-body {
  display: none;
  flex-direction: column;
  gap: 0;
  padding-top: .2rem;
}
.area-card.expanded .area-card-body { display: flex; }
.area-qa-item {
  display: flex; flex-direction: column; gap: .2rem;
  padding: .45rem 0;
  border-bottom: 1px solid var(--border);
}
.area-qa-item:last-child { border-bottom: none; padding-bottom: .05rem; }
.area-qa-question {
  font-size: .58rem; text-transform: uppercase; letter-spacing: .1em;
  color: var(--muted); line-height: 1.4; pointer-events: none;
  font-family: 'JetBrains Mono', monospace; padding-bottom: .15rem;
}
.area-qa-answer {
  color: var(--text); font-family: 'Crimson Pro', Georgia, serif;
  font-size: 1rem; line-height: 1.8; padding: 0;
  word-break: break-word;
}
.area-qa-answer p { margin-bottom: .4rem; }
.area-qa-answer p:last-child { margin-bottom: 0; }
.area-qa-answer h1, .area-qa-answer h2, .area-qa-answer h3 {
  font-family: 'DM Serif Display', serif; color: var(--text);
  line-height: 1.3; margin: .5rem 0 .15rem;
}
.area-qa-answer h1 { font-size: 1.15rem; }
.area-qa-answer h2 { font-size: 1.05rem; }
.area-qa-answer h3 { font-size: .95rem; }
.area-qa-answer strong { color: #fff; font-weight: 600; }
.area-qa-answer em { color: #fff; font-style: italic; }
.area-qa-answer ul, .area-qa-answer ol { margin: .3em 0 .3em 1.4em; padding: 0; }
.area-qa-answer li { margin: .15em 0; }
/* Dimension progress bars in card preview */
.dim-bar-list { display: flex; flex-direction: column; gap: .45rem; padding: .1rem 0; }
.dim-bar-item { display: flex; flex-direction: column; gap: .18rem; }
.dim-bar-label { font-family: 'Crimson Pro', Georgia, serif; font-size: .88rem; color: var(--text); line-height: 1.3; }
.dim-bar-track { height: 6px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; }
.dim-bar-fill { height: 100%; border-radius: 3px; background: var(--area-color); transition: width .4s ease; }
.dim-bar-meta { display: flex; justify-content: space-between; align-items: center; }
.dim-bar-pct { font-family: 'JetBrains Mono', monospace; font-size: .58rem; color: var(--muted); }
.dim-bar-score { font-family: 'JetBrains Mono', monospace; font-size: .58rem; color: var(--muted); }
/* Average score badge next to area name */
.area-avg-badge {
  font-family: 'JetBrains Mono', monospace; font-size: .58rem;
  padding: .12rem .38rem; border-radius: 2rem;
  background: color-mix(in srgb, var(--area-color) 18%, transparent);
  border: 1px solid color-mix(in srgb, var(--area-color) 40%, transparent);
  color: var(--area-color); flex-shrink: 0; white-space: nowrap;
  letter-spacing: .04em;
}
/* Swipe legend */
.swipe-legend {
  display: flex; align-items: center; justify-content: space-between;
  gap: .5rem; margin-top: .1rem; margin-bottom: .15rem;
}
.swipe-legend-item {
  display: flex; align-items: center; gap: .3rem;
  font-size: .58rem; text-transform: uppercase; letter-spacing: .08em;
  color: #60a5fa; opacity: .75;
}
.swipe-legend-sep { color: var(--muted); font-size: .7rem; }

/* Drag states */
.area-card.dragging { opacity: .35; cursor: grabbing; }
/* Drop placeholder shown between rows */
.drag-placeholder {
  height: 3px;
  border-radius: 2px;
  background: var(--drag-ph-color, #60a5fa);
  box-shadow: 0 0 10px 3px var(--drag-ph-color, #60a5fa);
  transition: opacity .15s;
  pointer-events: none;
}

/* Swipe gestures */
.area-card-outer-wrap {
  position: relative;
  overflow: hidden;
  border-radius: .75rem;
}
.area-card-swipe-wrap {
  position: relative;
  border-radius: .75rem;
}
.area-card-swipe-wrap .area-card {
  position: relative;
  z-index: 1;
  transition: transform .2s ease, opacity .15s;
  will-change: transform;
}
.swipe-hint {
  position: absolute;
  top: 0; bottom: 0;
  display: flex; align-items: center;
  padding: 0 1.2rem;
  font-size: .72rem; font-weight: 600; letter-spacing: .06em;
  opacity: 0;
  transition: opacity .15s;
  pointer-events: none;
  white-space: nowrap;
}
.swipe-hint-edit  { left: 0;  background: #60a5fa; color: #fff; border-radius: .75rem 0 0 .75rem; }
.swipe-hint-del   { right: 0; background: #f06a6a; color: #fff; border-radius: 0 .75rem .75rem 0; }
.swipe-hint svg   { flex-shrink: 0; }

/* ── STAMPA ── */
@media print {
  body { background: #fff !important; color: #111 !important; padding: 1rem !important; }
  body::before { display: none !important; }
  .sphere-outer, .swipe-legend, .sphere-add-btn, .back-btn, .area-card-handle,
  .swipe-hint, .area-card-chevron { display: none !important; }
  .page-title { font-size: 1.4rem !important; color: #111 !important; }
  .page-title em { color: #c0392b !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .section-label { color: #555 !important; font-size: .65rem !important; }
  .areas-grid { gap: .6rem !important; }
  .area-card-outer-wrap { break-inside: avoid !important; page-break-inside: avoid !important; margin-bottom: .5rem !important; }
  .area-card-row { display: flex !important; }
  .area-card-swipe-wrap { width: 100% !important; }
  .area-card {
    background: #fff !important;
    border: 1px solid #ccc !important;
    border-left: 3px solid var(--area-color) !important;
    border-radius: .5rem !important;
    padding: .75rem 1rem !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  .area-card-body { display: flex !important; }
  .area-card-dot { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  .area-card-name { color: #111 !important; font-size: .82rem !important; font-weight: 700 !important; border: none !important; }
  .area-qa-item { padding: .4rem 0 .4rem 1rem !important; border-bottom: 1px solid #e8e8e8 !important; }
  .area-qa-question { font-size: .6rem !important; color: #666 !important; margin-bottom: .2rem !important; font-family: 'JetBrains Mono', monospace !important; }
  .area-qa-answer { font-family: 'Crimson Pro', Georgia, serif !important; font-size: 1rem !important; color: #222 !important; line-height: 1.6 !important; padding-left: .75rem !important; }
  .area-qa-answer p { margin-bottom: .3rem !important; color: #222 !important; }
  .area-qa-answer h1, .area-qa-answer h2, .area-qa-answer h3 { color: #111 !important; margin: .4rem 0 .1rem !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  .area-qa-answer strong { color: #000 !important; font-weight: 700 !important; }
  .area-qa-answer ul, .area-qa-answer ol { margin-left: 1.2em !important; }
}
</style>
</head>
<body>
<div class="container">

  <div class="header-row">
    <a class="back-btn" href="index.html">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Home
    </a>
    <p class="page-title">Life <em>Wheel</em></p>
    <div style="width:58px"></div>
  </div>

  <div class="sphere-outer">
    <div class="sphere-wrap" id="sphereWrap">
      <canvas id="sphereCanvas"></canvas>
      <canvas id="ringCanvas" style="position:absolute;top:0;left:0;pointer-events:none;"></canvas>
      <div class="sphere-ring"></div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:.5rem">
    <span class="section-label">Aree della vita</span>
    <div class="swipe-legend">
      <span class="swipe-legend-item">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 5 5 12 12 19"/></svg>
        <span style="color:#60a5fa">← Scorri: elimina</span>
      </span>
      <span class="swipe-legend-sep">·</span>
      <span class="swipe-legend-item">
        <span style="color:#60a5fa">Scorri: modifica →</span>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </span>
    </div>
    <div class="areas-grid" id="areasGrid"></div>
  </div>

</div>

<script>
// ── AUTH ──────────────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://ezycobgovadcgvnyqcew.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ASHxxToKJyMy4CpBAqseqA_mepXAAJ-';
let sb = null;
let currentUserId = null;
try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e) {}

// ── DATA ──────────────────────────────────────────────────────────────────────
const STORE = 'vv_life_wheel';
const PALETTE = ['#f55036','#4ade80','#60a5fa','#f59e0b','#a78bfa','#34d399','#fb923c','#38bdf8','#f472b6','#facc15'];
const QUESTIONS_DEFAULT = [
  'Qual è la tua situazione attuale in {area}?',
  'Quali traguardi vuoi raggiungere in {area}?',
  'Chi sono i tuoi punti di riferimento in {area}?'
];
let QUESTIONS = [...QUESTIONS_DEFAULT];
let _QUESTIONS_FULL = QUESTIONS_DEFAULT.map(t => ({ text: t, hasMood: false, placeholder: '' }));
try {
  const _sq = localStorage.getItem('vv_lw_questions');
  if (_sq) {
    const _arr = JSON.parse(_sq);
    if (Array.isArray(_arr) && _arr.length > 0) {
      const _objs = _arr.map(q => typeof q === 'string' ? { text: q, hasMood: false, placeholder: '' } : q);
      const _texts = _objs.map(q => q.text || '');
      if (_texts.some(q => /\{area\}/i.test(q))) {
        QUESTIONS = _texts;
        _QUESTIONS_FULL = _objs;
      }
    }
  }
} catch(e) {}

function loadData() {
  try {
    const r = localStorage.getItem(STORE);
    if (r) {
      const d = JSON.parse(r);
      d.areas.forEach(a => {
        if (!a.answers) a.answers = new Array(QUESTIONS.length).fill('');
        // Extend answers array if questions were added
        while (a.answers.length < QUESTIONS.length) a.answers.push('');
      });
      return d;
    }
  } catch(e) {}
  return {
    areas: PALETTE.slice(0, 4).map((color, i) => ({ id: i + 1, color, label: '', answers: ['', '', ''] })),
    nextId: 5
  };
}

function save() {
  data.lastModified = new Date().toISOString();
  try { localStorage.setItem(STORE, JSON.stringify(data)); } catch(e) {}
  saveToCloud();
}

let data = loadData();

// ── CLOUD SYNC ────────────────────────────────────────────────────────────────
function _hasLabels(areas) {
  return Array.isArray(areas) && areas.some(a => a.label && a.label.trim());
}

async function loadFromCloud() {
  if (!sb || !currentUserId) return;
  try {
    const { data: row, error } = await sb
      .from('vv_life_wheel_state')
      .select('areas, next_id, questions, updated_at')
      .eq('user_id', currentUserId)
      .maybeSingle();

    const localHasData = _hasLabels(data.areas);
    const cloudHasData = !error && row && _hasLabels(row.areas);

    if (!cloudHasData) {
      // Cloud vuoto o assente → se locale ha dati, caricali subito sul cloud
      if (localHasData) await _doSaveToCloud();
      return;
    }

    if (!localHasData) {
      // Solo il cloud ha dati → usa cloud
    } else {
      // Entrambi hanno dati → vince il più recente per timestamp
      const localTs = data.lastModified || '1970-01-01T00:00:00.000Z';
      const cloudTs = row.updated_at   || '1970-01-01T00:00:00.000Z';
      if (localTs >= cloudTs) {
        // Locale più recente → sovrascrive cloud
        await _doSaveToCloud();
        return;
      }
      // Cloud più recente → cade nel blocco sotto
    }

    // Carica i dati dal cloud
    const cloudData = { areas: row.areas, nextId: row.next_id || 5, lastModified: row.updated_at };
    cloudData.areas.forEach(a => {
      if (!a.answers) a.answers = new Array(QUESTIONS.length).fill('');
      while (a.answers.length < QUESTIONS.length) a.answers.push('');
    });
    localStorage.setItem(STORE, JSON.stringify(cloudData));
    data = cloudData;

    if (Array.isArray(row.questions) && row.questions.length > 0) {
      const _fullObjs = row.questions.map(q => typeof q === 'string' ? { text: q, hasMood: false, placeholder: '' } : q);
      const _texts = _fullObjs.map(q => q.text || '');
      if (_texts.some(q => /\{area\}/i.test(q))) {
        QUESTIONS.length = 0;
        _QUESTIONS_FULL.length = 0;
        _texts.forEach(q => QUESTIONS.push(q));
        _fullObjs.forEach(q => _QUESTIONS_FULL.push(q));
        localStorage.setItem('vv_lw_questions', JSON.stringify(_QUESTIONS_FULL));
      }
    }
  } catch(e) {}
}

let _saveCloudTimer = null;
function saveToCloud() {
  if (!sb || !currentUserId) return;
  // Debounce per evitare troppe scritture durante la digitazione
  clearTimeout(_saveCloudTimer);
  _saveCloudTimer = setTimeout(_doSaveToCloud, 1500);
}

async function _doSaveToCloud() {
  if (!sb || !currentUserId) return;
  try {
    const _now = new Date().toISOString();
    data.lastModified = _now;
    try { localStorage.setItem(STORE, JSON.stringify(data)); } catch(e) {}
    await sb.from('vv_life_wheel_state').upsert({
      user_id:    currentUserId,
      areas:      data.areas,
      next_id:    data.nextId,
      questions:  _QUESTIONS_FULL,
      updated_at: _now
    }, { onConflict: 'user_id' });

    // Upsert le risposte di ogni area come nota in 'notes' per la vettorializzazione
    for (const area of data.areas) {
      if (!area.label || !area.answers || !area.answers.some(a => a && a.trim())) continue;
      const content = QUESTIONS.map((q, i) => {
        const ans = (area.answers[i] || '').trim();
        if (!ans) return '';
        return '<h3>' + q.replace(/\{area\}/gi, area.label) + '</h3><p>' + ans + '</p>';
      }).filter(Boolean).join('\n');
      if (!content) continue;
      const noteTitle = '[Life Wheel] ' + area.label;
      const { data: existing } = await sb.from('notes')
        .select('id')
        .eq('user_id', currentUserId)
        .eq('mode', 'life-wheel')
        .eq('title', noteTitle)
        .limit(1);
      if (existing && existing.length > 0) {
        await sb.from('notes')
          .update({ content, updated_at: new Date().toISOString() })
          .eq('id', existing[0].id);
      } else {
        await sb.from('notes').insert([{
          title:     noteTitle,
          content,
          note_date: new Date().toISOString().split('T')[0],
          mode:      'life-wheel',
          user_id:   currentUserId
        }]);
      }
    }
  } catch(e) {}
}

// ── SPHERE ────────────────────────────────────────────────────────────────────
const wrap   = document.getElementById('sphereWrap');
const canvas = document.getElementById('sphereCanvas');
const ctx    = canvas.getContext('2d');

// Responsive sizing
const WRAP_SIZE = wrap.offsetWidth;
const CANVAS_W  = Math.round(WRAP_SIZE * 0.84);
const SR        = Math.round(CANVAS_W  * 0.44);  // sphere radius
const FOV       = 400;
const CX = CANVAS_W / 2, CY = CANVAS_W / 2;
const _dpr = window.devicePixelRatio || 1;
canvas.width  = Math.round(CANVAS_W * _dpr);
canvas.height = Math.round(CANVAS_W * _dpr);
canvas.style.width  = CANVAS_W + 'px';
canvas.style.height = CANVAS_W + 'px';
ctx.scale(_dpr, _dpr);
const _cvOff = Math.round((WRAP_SIZE - CANVAS_W) / 2);
canvas.style.left = _cvOff + 'px';
canvas.style.top  = _cvOff + 'px';

const NUM_PTS   = 72;   // dot count
const CONN_DIST = SR * 0.16;  // max 3-D distance for a connection
const TILT      = 0.22;
const cosTilt   = Math.cos(TILT), sinTilt = Math.sin(TILT);

function hexRgb(h) {
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}

// Connection opacity state — each pair [i][j] has a live alpha for smooth fade in/out
let connAlpha = [];  // flat array, index = i*NUM_PTS + j

let pts = [];

function mkPts() {
  pts = [];
  connAlpha = new Float32Array(NUM_PTS * NUM_PTS); // all 0
  for (let i = 0; i < NUM_PTS; i++) {
    const phi   = Math.acos(1 - 2 * (i + .5) / NUM_PTS); // Fibonacci
    const theta = Math.PI * (1 + Math.sqrt(5)) * i;
    const x = SR * Math.sin(phi) * Math.cos(theta);
    const y = SR * Math.cos(phi);
    const z = SR * Math.sin(phi) * Math.sin(theta);
    pts.push({
      wx: x, wy: y, wz: z,
      // faster, more chaotic initial velocities
      vx: (Math.random() - .5) * 0.55,
      vy: (Math.random() - .5) * 0.55,
      vz: (Math.random() - .5) * 0.55,
      // random impulse timer so bursts are desynchronised
      impTimer: Math.floor(Math.random() * 80),
      colorIdx: i % Math.max(data.areas.length, 1)
    });
  }
}
mkPts();

let ry = 0;

function project(wx, wy, wz) {
  const rx =  wx * Math.cos(ry) + wz * Math.sin(ry);
  const rz = -wx * Math.sin(ry) + wz * Math.cos(ry);
  const ty = wy * cosTilt - rz * sinTilt;
  const tz = wy * sinTilt + rz * cosTilt;
  const s  = FOV / (FOV + tz + SR);
  return { px: CX + rx * s, py: CY + ty * s, z: tz, s };
}

function drawSphere() {
  ry += 0.006;
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_W);

  const n = Math.max(data.areas.length, 1);

  // ── Physics update ──
  pts.forEach((p, i) => {
    p.colorIdx = i % n;
    p.wx += p.vx;  p.wy += p.vy;  p.wz += p.vz;

    // elastic pull toward sphere surface
    const dist = Math.sqrt(p.wx*p.wx + p.wy*p.wy + p.wz*p.wz) || 1;
    const pull = (SR - dist) * 0.018;
    p.vx += (p.wx / dist) * pull;
    p.vy += (p.wy / dist) * pull;
    p.vz += (p.wz / dist) * pull;

    // continuous random turbulence
    p.vx += (Math.random() - .5) * 0.26;
    p.vy += (Math.random() - .5) * 0.26;
    p.vz += (Math.random() - .5) * 0.26;

    // random impulse burst every ~40-80 frames per dot
    p.impTimer--;
    if (p.impTimer <= 0) {
      p.vx += (Math.random() - .5) * 2.4;
      p.vy += (Math.random() - .5) * 2.4;
      p.vz += (Math.random() - .5) * 2.4;
      p.impTimer = 40 + Math.floor(Math.random() * 40);
    }

    // dampen
    p.vx *= 0.90;  p.vy *= 0.90;  p.vz *= 0.90;
  });

  // ── Project ──
  const proj = pts.map(p => {
    const pr = project(p.wx, p.wy, p.wz);
    return { ...pr, wx: p.wx, wy: p.wy, wz: p.wz, colorIdx: p.colorIdx };
  });

  proj.sort((a, b) => a.z - b.z);

  // ── Connections: fade alpha in/out per pair ──
  const FADE_IN  = 0.035;
      const FADE_OUT = 0.020;

  ctx.save();
  for (let i = 0; i < proj.length; i++) {
    for (let j = i + 1; j < proj.length; j++) {
      const pi = proj[i], pj = proj[j];
      const dx = pi.wx - pj.wx, dy = pi.wy - pj.wy, dz = pi.wz - pj.wz;
      const d3 = Math.sqrt(dx*dx + dy*dy + dz*dz);
      const key = i * NUM_PTS + j;

      const inRange = d3 < CONN_DIST;
      let a = connAlpha[key];
      if (inRange) {
        const t = 1 - d3 / CONN_DIST;
        const depthI = (pi.z + SR) / (2 * SR);
        const depthJ = (pj.z + SR) / (2 * SR);
        const target = 0.32 + t * (0.45 + ((depthI + depthJ) / 2) * 0.20);
        a += (target - a) * FADE_IN;
      } else {
        a -= FADE_OUT;
        if (a < 0) a = 0;
      }
      connAlpha[key] = a;

      if (a < 0.01) continue;

      const colI = data.areas[pi.colorIdx]?.color || PALETTE[pi.colorIdx % PALETTE.length];
      const colJ = data.areas[pj.colorIdx]?.color || PALETTE[pj.colorIdx % PALETTE.length];
      const [ri,gi,bi] = hexRgb(colI);
      const [rj,gj,bj] = hexRgb(colJ);
      const rm = Math.round((ri+rj)/2), gm = Math.round((gi+gj)/2), bm = Math.round((bi+bj)/2);

      ctx.beginPath();
      ctx.moveTo(pi.px, pi.py);
      ctx.lineTo(pj.px, pj.py);
      ctx.strokeStyle = `rgba(${rm},${gm},${bm},${a.toFixed(3)})`;
      ctx.lineWidth = 2.2;
      ctx.stroke();
    }
  }
  ctx.restore();

  // ── Dots ──
  proj.forEach(p => {
    const depth  = (p.z + SR) / (2 * SR);
    const alpha  = (0.25 + depth * 0.75).toFixed(2);
    const color  = data.areas[p.colorIdx]?.color || PALETTE[p.colorIdx % PALETTE.length];
    const [r, g, b] = hexRgb(color);
    // larger dot radius
    const radius = (2.2 + depth * 3.4) * p.s;

    // glow halo
    ctx.beginPath();
    ctx.arc(p.px, p.py, Math.max(1, radius * 2.6), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r},${g},${b},${(depth * 0.10).toFixed(3)})`;
    ctx.fill();

    // solid dot
    ctx.beginPath();
    ctx.arc(p.px, p.py, Math.max(1, radius), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.fill();
  });

  requestAnimationFrame(drawSphere);
}
drawSphere();

// ── LABELS AROUND SPHERE ──────────────────────────────────────────────────────
const ringCanvas = document.getElementById('ringCanvas');
const ringCtx    = ringCanvas.getContext('2d');
ringCanvas.width  = WRAP_SIZE;
ringCanvas.height = WRAP_SIZE;

const RING_R_OUT = Math.round(WRAP_SIZE * 0.468);
const RING_WIDTH = 22;
const RING_R_IN  = RING_R_OUT - RING_WIDTH;
const RING_R_MID = RING_R_OUT - RING_WIDTH / 2;
const RING_CX    = WRAP_SIZE / 2;
const RING_CY    = WRAP_SIZE / 2;
const ADD_SLOT   = 0.44; // radians reserved for add button at top

function renderLabels() {
  const n          = data.areas.length;
  const arcStart   = -Math.PI / 2 + ADD_SLOT / 2;
  const totalArc   = 2 * Math.PI - ADD_SLOT;
  const segStep    = totalArc / n;
  const GAP        = 0.022;

  ringCtx.clearRect(0, 0, WRAP_SIZE, WRAP_SIZE);

  data.areas.forEach((area, i) => {
    const segStart = arcStart + segStep * i + GAP;
    const segEnd   = arcStart + segStep * (i + 1) - GAP;
    const midAngle = arcStart + segStep * (i + 0.5);

    // Filled arc segment
    ringCtx.beginPath();
    ringCtx.arc(RING_CX, RING_CY, RING_R_OUT, segStart, segEnd);
    ringCtx.arc(RING_CX, RING_CY, RING_R_IN, segEnd, segStart, true);
    ringCtx.closePath();
    ringCtx.fillStyle = area.color + '1e';
    ringCtx.fill();

    // Outer arc
    ringCtx.beginPath();
    ringCtx.arc(RING_CX, RING_CY, RING_R_OUT, segStart, segEnd);
    ringCtx.strokeStyle = area.color + 'bb';
    ringCtx.lineWidth = 1.5;
    ringCtx.stroke();

    // Inner arc
    ringCtx.beginPath();
    ringCtx.arc(RING_CX, RING_CY, RING_R_IN, segStart, segEnd);
    ringCtx.strokeStyle = area.color + '44';
    ringCtx.lineWidth = 1;
    ringCtx.stroke();

    // Radial divider at segment start
    ringCtx.beginPath();
    ringCtx.moveTo(RING_CX + RING_R_IN * Math.cos(segStart), RING_CY + RING_R_IN * Math.sin(segStart));
    ringCtx.lineTo(RING_CX + RING_R_OUT * Math.cos(segStart), RING_CY + RING_R_OUT * Math.sin(segStart));
    ringCtx.strokeStyle = area.color + '99';
    ringCtx.lineWidth = 1.5;
    ringCtx.stroke();
  });

  // Final divider after last segment
  const lastEnd = arcStart + segStep * n - GAP;
  ringCtx.beginPath();
  ringCtx.moveTo(RING_CX + RING_R_IN * Math.cos(lastEnd), RING_CY + RING_R_IN * Math.sin(lastEnd));
  ringCtx.lineTo(RING_CX + RING_R_OUT * Math.cos(lastEnd), RING_CY + RING_R_OUT * Math.sin(lastEnd));
  ringCtx.strokeStyle = data.areas[n - 1].color + '99';
  ringCtx.lineWidth = 1.5;
  ringCtx.stroke();

  // Add button at top (canvas angle -π/2)
  let addBtn = document.getElementById('sphereAddBtn');
  if (!addBtn) {
    addBtn = document.createElement('button');
    addBtn.id        = 'sphereAddBtn';
    addBtn.className = 'sphere-add-btn';
    addBtn.title     = 'Nuova area';
    addBtn.textContent = '+';
    addBtn.onclick   = addArea;
    wrap.appendChild(addBtn);
  }
  addBtn.style.left = (WRAP_SIZE / 2) + 'px';
  addBtn.style.top  = (WRAP_SIZE / 2 - RING_R_MID) + 'px';
}

// ── CARDS ─────────────────────────────────────────────────────────────────────
const grid = document.getElementById('areasGrid');
let dragSrcIdx = null;

function _safeHtml(html) {
  const _d = document.createElement('div');
  _d.innerHTML = html;
  _d.querySelectorAll('script,style,iframe,object,embed,form,input,textarea,button,select').forEach(el => el.remove());
  _d.querySelectorAll('*').forEach(el => {
    for (const attr of [...el.attributes]) {
      if (/^on/i.test(attr.name)) el.removeAttribute(attr.name);
    }
  });
  return _d.innerHTML;
}

function renderCards() {
  grid.innerHTML = '';
  data.areas.forEach((area, i) => {
    // ── swipe wrapper ──

    row.className = 'area-card-row';

    const wrap = document.createElement('div');
    wrap.className = 'area-card-swipe-wrap';

    // Handle DELETE (right)
    const handleDel = document.createElement('button');
    handleDel.className = 'area-card-handle area-card-handle-del';
    handleDel.title = 'Elimina';
    // Red X instead of trash
    handleDel.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    handleDel.addEventListener('click', e => {
      e.stopPropagation();
      if (data.areas.length <= 1) return;
      data.areas = data.areas.filter(a => a.id !== area.id);
      save(); mkPts(); renderLabels(); renderCards();
    });

    const hintEdit = document.createElement('div');
    hintEdit.className = 'swipe-hint swipe-hint-edit';
    hintEdit.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>';

    const hintDel = document.createElement('div');
    hintDel.className = 'swipe-hint swipe-hint-del';
    hintDel.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>';

    const card = document.createElement('div');
    card.className = 'area-card';
    card.id = 'area-card-' + area.id;
    row.style.setProperty('--area-color', area.color);
    card.style.setProperty('--area-color', area.color);
    card.draggable = true;
    card.addEventListener('dragstart', e => {
      dragSrcIdx = i;
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => card.classList.add('dragging'), 0);
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      // Remove any leftover placeholder
      document.querySelectorAll('.drag-placeholder').forEach(p => p.remove());
    });
    card.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (dragSrcIdx === i) return;
      // Remove existing placeholders
      document.querySelectorAll('.drag-placeholder').forEach(p => p.remove());
      // Determine if cursor is in top or bottom half of the row
      const rect = row.getBoundingClientRect();
      const mid  = rect.top + rect.height / 2;
      const ph   = document.createElement('div');
      ph.className = 'drag-placeholder';
      ph.style.setProperty('--drag-ph-color', area.color);
      if (e.clientY < mid) {
        grid.insertBefore(ph, row);
      } else {
        grid.insertBefore(ph, row.nextSibling);
      }
    });
    card.addEventListener('dragleave', e => {
      // Only remove if leaving outside the grid entirely
      if (!grid.contains(e.relatedTarget)) {
        document.querySelectorAll('.drag-placeholder').forEach(p => p.remove());
      }
    });
    card.addEventListener('drop', e => {
      e.preventDefault(); e.stopPropagation();
      document.querySelectorAll('.drag-placeholder').forEach(p => p.remove());
      if (dragSrcIdx === null || dragSrcIdx === i) return;
      // Determine insert position (top/bottom half)
      const rect = row.getBoundingClientRect();
      const mid  = rect.top + rect.height / 2;
      let targetIdx = i;
      if (e.clientY >= mid && dragSrcIdx < i) targetIdx = i;
      else if (e.clientY < mid && dragSrcIdx > i) targetIdx = i;
      const moved = data.areas.splice(dragSrcIdx, 1)[0];
      data.areas.splice(targetIdx, 0, moved);
      dragSrcIdx = null;
      save(); mkPts(); renderLabels(); renderCards();
    });
    const header = document.createElement('div');
    header.className = 'area-card-header';

    const chevron = document.createElement('button');
    chevron.className = 'area-card-chevron';
    chevron.title = 'Espandi / Comprimi';
    chevron.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
    chevron.addEventListener('click', e => {
      e.stopPropagation();
      const wasExpanded = card.classList.contains('expanded');
      document.querySelectorAll('.area-card.expanded').forEach(c => c.classList.remove('expanded'));
      if (!wasExpanded) card.classList.add('expanded');
    });

    const dot = document.createElement('div');
    dot.className = 'area-card-dot';

    const nameInput = document.createElement('input');
    nameInput.className   = 'area-card-name';
    nameInput.type        = 'text';
    nameInput.placeholder = 'Nome area…';
    nameInput.maxLength   = 28;
    nameInput.value       = area.label || '';

    // ── Parse dimension answer for the 'situazione attuale' question ──
    function _parseDims(html) {
      if (!html || !html.includes('<p>')) return null;
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      const dims = [];
      tmp.querySelectorAll('p').forEach(p => {
        const strong = p.querySelector('strong');
        if (!strong) return;
        const label = strong.textContent.replace(/:$/, '').trim();
        const m = p.textContent.match(/(\d+)\s*\/\s*5/);
        if (label) dims.push({ label, score: m ? parseInt(m[1], 10) : null });
      });
      return dims.length ? dims : null;
    }

    // ── Compute average score for this area (from Q situazione dims) ──
    const _sQIdx = QUESTIONS.findIndex(q => /situazione\s+attuale/i.test(q));
    const _sAns  = _sQIdx >= 0 ? ((area.answers && area.answers[_sQIdx]) || '') : '';
    const _sDims = _parseDims(_sAns);
    const _scored = _sDims ? _sDims.filter(d => d.score !== null) : [];
    const _avg = _scored.length ? (_scored.reduce((s, d) => s + d.score, 0) / _scored.length) : null;

    header.appendChild(chevron);
    header.appendChild(dot);
    header.appendChild(nameInput);
    if (_avg !== null) {
      const badge = document.createElement('span');
      badge.className = 'area-avg-badge';
      badge.textContent = Math.round(_avg * 20) + '%';
      badge.title = 'Media soddisfazione: ' + _avg.toFixed(1) + ' / 5';
      header.appendChild(badge);
    }

    const body = document.createElement('div');
    body.className = 'area-card-body';

    QUESTIONS.forEach((q, qi) => {
      const item = document.createElement('div');
      item.className = 'area-qa-item';
      const qlabel = document.createElement('div');
      qlabel.className = 'area-qa-question';
      qlabel.textContent = (area.label
        ? QUESTIONS[qi].replace(/\{area\}/gi, area.label)
        : QUESTIONS[qi].replace(/\{area\}/gi, 'quest\'area'));
      const ans = document.createElement('div');
      ans.className = 'area-qa-answer';
      const ansRaw = (area.answers && area.answers[qi]) || '';
      // For the 'situazione attuale' question, render dims as progress bars
      const _qIsSit = /situazione\s+attuale/i.test(QUESTIONS[qi]);
      const _dims = _qIsSit ? _parseDims(ansRaw) : null;
      if (_dims) {
        const list = document.createElement('div');
        list.className = 'dim-bar-list';
        _dims.forEach(d => {
          const pct = d.score !== null ? Math.round(d.score * 20) : null;
          const di = document.createElement('div');
          di.className = 'dim-bar-item';
          const meta = document.createElement('div');
          meta.className = 'dim-bar-meta';
          const lbl = document.createElement('span');
          lbl.className = 'dim-bar-label';
          lbl.textContent = d.label;
          const sc = document.createElement('span');
          sc.className = 'dim-bar-score';
          sc.textContent = d.score !== null ? d.score + ' / 5' : '—';
          meta.appendChild(lbl);
          meta.appendChild(sc);
          const track = document.createElement('div');
          track.className = 'dim-bar-track';
          const fill = document.createElement('div');
          fill.className = 'dim-bar-fill';
          fill.style.width = (pct !== null ? pct : 0) + '%';
          track.appendChild(fill);
          di.appendChild(meta);
          di.appendChild(track);
          list.appendChild(di);
        });
        ans.appendChild(list);
      } else if (ansRaw && ansRaw.includes('<')) {
        ans.innerHTML = _safeHtml(ansRaw);
      } else {
        ans.textContent = ansRaw;
      }
      item.appendChild(qlabel);
      item.appendChild(ans);
      body.appendChild(item);
    });

    // Name is always editable inline

    card.appendChild(header);
    card.appendChild(body);
    wrap.appendChild(card);
    row.appendChild(handleEdit);
    row.appendChild(wrap);
    row.appendChild(handleDel);
    const outerWrap = document.createElement('div');
    outerWrap.className = 'area-card-outer-wrap';
    outerWrap.appendChild(hintEdit);
    outerWrap.appendChild(hintDel);
    outerWrap.appendChild(row);
    grid.appendChild(outerWrap);

    // ── SWIPE GESTURE (touch + mouse) ──────────────────────────────────
    const SWIPE_THRESHOLD = () => window.innerWidth * 0.45;
    let _tx0 = 0, _ty0 = 0, _swiping = false, _swipeLocked = false;

    function _onStart(clientX, clientY) {
      _tx0 = clientX; _ty0 = clientY;
      _swiping = false; _swipeLocked = false;
    }
    function _onMove(clientX, clientY, e) {
      if (_swipeLocked) return;
      const dx = clientX - _tx0;
      const dy = clientY - _ty0;
      if (!_swiping && Math.abs(dy) > Math.abs(dx)) { _swipeLocked = true; return; }
      if (Math.abs(dx) > 6) _swiping = true;
      if (!_swiping) return;
      if (e && e.cancelable) e.preventDefault();
      const thr = SWIPE_THRESHOLD();
      const clamped = Math.max(-thr * 1.2, Math.min(thr * 1.2, dx));
      row.style.transform = 'translateX(' + clamped + 'px)';
      const ratio = Math.min(1, Math.abs(dx) / thr);
      if (dx > 0) { hintEdit.style.opacity = ratio; hintDel.style.opacity = 0; }
      else        { hintDel.style.opacity = ratio;  hintEdit.style.opacity = 0; }
    }
    function _onEnd(clientX) {
      if (!_swiping) return;
      const dx = clientX - _tx0;
      const thr = SWIPE_THRESHOLD();
      row.style.transition = 'transform .25s ease';
      row.style.transform = '';
      hintEdit.style.opacity = 0;
      hintDel.style.opacity = 0;
      setTimeout(() => { row.style.transition = ''; }, 260);
      if (dx > thr) {
        const overlay = document.getElementById('lwDiaryOverlay');
        const frame   = document.getElementById('lwDiaryFrame');
        if (overlay && frame) {
          frame.src = 'guidedDiary_func.html?mode=life-wheel&areaId=' + area.id + '&popup=1';
          overlay.style.display = 'block';
        }
      } else if (dx < -thr) {
        if (data.areas.length <= 1) return;
        data.areas = data.areas.filter(a => a.id !== area.id);
        save(); mkPts(); renderLabels(); renderCards();
      }
    }

    // Touch — on row so entire row (handles included) can initiate swipe
    row.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) return;
      if (e.target.closest('.area-card-handle')) return;
      _onStart(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    row.addEventListener('touchmove', e => {
      if (e.touches.length !== 1) return;
      _onMove(e.touches[0].clientX, e.touches[0].clientY, e);
    }, { passive: false });
    row.addEventListener('touchend', e => {
      _onEnd(e.changedTouches[0].clientX);
    }, { passive: true });

    // Mouse (PC) — document listeners so tracking works as row translates
    row.addEventListener('mousedown', e => {
      if (e.button !== 0) return;
      if (e.target.closest('.area-card-handle')) return;
      _onStart(e.clientX, e.clientY);
      const _onDocMove = ev => _onMove(ev.clientX, ev.clientY, ev);
      const _onDocUp = ev => {
        _onEnd(ev.clientX);
        document.removeEventListener('mousemove', _onDocMove);
        document.removeEventListener('mouseup', _onDocUp);
      };
      document.addEventListener('mousemove', _onDocMove);
      document.addEventListener('mouseup', _onDocUp);
    });

    nameInput.addEventListener('click', e => e.stopPropagation());
    nameInput.addEventListener('input', () => {
      area.label = nameInput.value;
      save();
      renderLabels();
      // Update {area} placeholders live in this card's question labels
      body.querySelectorAll('.area-qa-question').forEach((ql, qi) => {
        ql.textContent = QUESTIONS[qi]
          ? QUESTIONS[qi].replace(/\{area\}/gi, area.label || 'quest\'area')
          : ql.textContent;
      });
    });
    // Mostra sempre tutte le domande nelle card espanse
    body.querySelectorAll('.area-qa-item').forEach(itm => { itm.style.display = ''; });
  });
}

// ── ADD AREA ──────────────────────────────────────────────────────────────────
function addArea() {
  const used  = new Set(data.areas.map(a => a.color));
  const color = PALETTE.find(c => !used.has(c)) || PALETTE[data.areas.length % PALETTE.length];
  const newId = data.nextId;
  data.areas.push({ id: data.nextId++, color, label: '', answers: ['', '', ''] });
  save(); mkPts(); renderLabels(); renderCards();
  // Focus sul nome della nuova card senza espanderla
  const newCard = document.getElementById('area-card-' + newId);
  if (newCard) {
    const ni = newCard.querySelector('.area-card-name');
    if (ni) { ni.focus(); ni.select(); }
  }
}

// ── RING CLICK → OPEN CARD ───────────────────────────────────────────────────
wrap.addEventListener('click', e => {
  const rect = wrap.getBoundingClientRect();
  const dx = e.clientX - rect.left  - WRAP_SIZE / 2;
  const dy = e.clientY - rect.top   - WRAP_SIZE / 2;
  const dist = Math.hypot(dx, dy);
  if (dist < RING_R_IN || dist > RING_R_OUT) return; // outside ring band
  let angle = Math.atan2(dy, dx);
  const arcStart = -Math.PI / 2 + ADD_SLOT / 2;
  const totalArc = 2 * Math.PI - ADD_SLOT;
  const segStep  = totalArc / data.areas.length;
  // Normalise angle into [arcStart, arcStart+totalArc)
  while (angle < arcStart)          angle += 2 * Math.PI;
  while (angle > arcStart + 2*Math.PI) angle -= 2 * Math.PI;
  if (angle > arcStart + totalArc) return; // inside the ADD_SLOT gap
  const idx = Math.floor((angle - arcStart) / segStep);
  if (idx < 0 || idx >= data.areas.length) return;
  const targetCard = document.getElementById('area-card-' + data.areas[idx].id);
  if (!targetCard) return;
  e.stopPropagation();
  const wasExpanded = targetCard.classList.contains('expanded');
  document.querySelectorAll('.area-card.expanded').forEach(c => c.classList.remove('expanded'));
  if (!wasExpanded) targetCard.classList.add('expanded');
});

// ── INIT ──────────────────────────────────────────────────────────────────────
// Render immediato da localStorage (come prima, nessuna dipendenza da auth)
renderLabels();
renderCards();

// Cloud sync in background: non blocca mai il rendering
(async () => {
  // Carica i default delle domande dal JSON (stessa fonte usata da guidedDiary_func.html)
  // Solo se localStorage non ha già domande personalizzate
  const _hasCustomQ = (() => {
    try {
      const s = localStorage.getItem('vv_lw_questions');
      if (!s) return false;
      const a = JSON.parse(s);
      return Array.isArray(a) && a.length > 0;
    } catch(e) { return false; }
  })();
  if (!_hasCustomQ) {
    try {
      const _qResp = await fetch('questions-life-wheel.json');
      if (_qResp.ok) {
        const _qArr = await _qResp.json();
        if (Array.isArray(_qArr) && _qArr.length > 0) {
          const _fullObjs = _qArr.map(q => typeof q === 'string' ? { text: q, hasMood: false, placeholder: '' } : q).filter(q => q.text);
          const _mapped = _fullObjs.map(q => q.text);
          if (_mapped.some(q => /\{area\}/i.test(q))) {
            QUESTIONS.length = 0;
            _QUESTIONS_FULL.length = 0;
            _mapped.forEach(q => QUESTIONS.push(q));
            _fullObjs.forEach(q => _QUESTIONS_FULL.push(q));
          }
        }
      }
    } catch(e) {}
  }

  if (!sb) { mkPts(); renderLabels(); renderCards(); return; }
  await VvAuth.init(sb);
  try {
    const { data: { session } } = await sb.auth.getSession();
    currentUserId = session?.user?.id || null;
    if (!currentUserId) return;
    await loadFromCloud();
    // Se il cloud ha restituito dati diversi da localStorage, ri-renderizza
    mkPts(); renderLabels(); renderCards();
  } catch(e) {}
})();
// ── DIARY POPUP (life-wheel edit) ──────────────────────────────────────
window.addEventListener('message', async e => {
  if (!e.data || typeof e.data !== 'object') return;
  const ov = document.getElementById('lwDiaryOverlay');
  const fr = document.getElementById('lwDiaryFrame');
  if (e.data.type === 'lw-diary-saved') {
    if (ov) ov.style.display = 'none';
    if (fr) fr.src = 'about:blank';
    // guidedDiary_func.html ha già scritto su localStorage: rileggi da lì
    // e marca come "più recente di qualsiasi copia cloud" prima di fare sync
    data = loadData();
    data.lastModified = new Date().toISOString();
    try { localStorage.setItem(STORE, JSON.stringify(data)); } catch(e2) {}
    mkPts(); renderLabels(); renderCards();
    // Ora spinge i dati aggiornati al cloud (senza debounce)
    if (currentUserId) await _doSaveToCloud();
  } else if (e.data.type === 'lw-diary-close') {
    if (ov) ov.style.display = 'none';
    if (fr) fr.src = 'about:blank';
  }
});
// ── EMBED MODE ───────────────────────────────────────────────────────────────
if (new URLSearchParams(location.search).get('embed') === '1') {
  document.querySelector('.header-row').style.display = 'none';
  document.body.style.padding = '.5rem .5rem 1rem';
  function notifyHeight() {
    const h = document.body.scrollHeight;
    if (window.parent !== window) window.parent.postMessage({ type: 'lw-height', h }, '*');
  }
  new ResizeObserver(notifyHeight).observe(document.body);
  notifyHeight();
}
</script>

  <iframe id="lwDiaryFrame" style="width:100%;height:100%;border:none;" src="about:blank" allow="microphone"></iframe>
</div>
